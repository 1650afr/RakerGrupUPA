<title>UPA — Online</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --primary: #0d9488; --primary-dark: #0f766e; --primary-light: #ccfbf1;
    --accent: #f59e0b; --accent-light: #fef3c7;
    --bg: #f1f5f9; --card: #ffffff; --text: #0f172a; --muted: #64748b;
    --border: #e2e8f0; --danger: #ef4444; --success: #10b981;
    --wa: #25D366; --sidebar: #0f2e2b; --sidebar-hover: #134e4a;
  }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
  .app { display: flex; min-height: 100vh; }
  .sidebar { width: 250px; background: var(--sidebar); color: #e2e8f0; display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 100; transition: transform .3s; }
  .brand { display: flex; align-items: center; gap: 12px; padding: 20px 18px; border-bottom: 1px solid rgba(255,255,255,.08); }
  .brand-logo { font-size: 28px; background: linear-gradient(135deg, var(--primary), var(--accent)); width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; box-shadow: 0 4px 12px rgba(13,148,136,.4); }
  .brand-title { font-weight: 800; font-size: 15px; color: #fff; }
  .brand-sub { font-size: 12px; color: #94a3b8; }
  nav { flex: 1; padding: 12px 10px; overflow-y: auto; }
  .nav-item { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 10px; cursor: pointer; margin-bottom: 3px; font-size: 14px; font-weight: 500; color: #cbd5e1; transition: all .2s; user-select: none; }
  .nav-item:hover { background: var(--sidebar-hover); color: #fff; }
  .nav-item.active { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; box-shadow: 0 4px 12px rgba(13,148,136,.35); }
  .nav-item .ico { font-size: 18px; width: 22px; text-align: center; }
  .sidebar-footer { padding: 14px; font-size: 11px; color: #64748b; text-align: center; border-top: 1px solid rgba(255,255,255,.08); }
  .main { flex: 1; margin-left: 250px; display: flex; flex-direction: column; min-width: 0; }
  .topbar { background: #fff; padding: 14px 22px; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50; flex-wrap: wrap; }
  .menu-btn { display: none; background: none; border: none; font-size: 22px; cursor: pointer; color: var(--text); }
  .topbar h1 { font-size: 18px; font-weight: 700; flex: 1; min-width: 100px; }
  .topbar-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .icon-btn { position: relative; background: var(--bg); border: 1px solid var(--border); width: 40px; height: 40px; border-radius: 10px; font-size: 18px; cursor: pointer; display: grid; place-items: center; transition: all .2s; }
  .icon-btn:hover { background: var(--primary-light); border-color: var(--primary); }
  .icon-btn .badge { position: absolute; top: -4px; right: -4px; background: var(--danger); color: #fff; font-size: 10px; font-weight: 700; min-width: 18px; height: 18px; border-radius: 9px; display: grid; place-items: center; padding: 0 4px; border: 2px solid #fff; }
  .badge.hidden { display: none; }
  .cloud-pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; background: var(--bg); border: 1px solid var(--border); cursor: pointer; transition: all .2s; }
  .cloud-pill:hover { transform: translateY(-1px); box-shadow: 0 4px 10px rgba(0,0,0,.08); }
  .cloud-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: #94a3b8; }
  .cloud-pill.syncing .dot { background: var(--accent); animation: pulse 1s infinite; }
  .cloud-pill.online  .dot { background: var(--success); }
  .cloud-pill.error   .dot { background: var(--danger); }
  .cloud-pill.offline { color: #64748b; }
  .cloud-pill.syncing { color: #b45309; background: var(--accent-light); }
  .cloud-pill.online  { color: #065f46; background: #d1fae5; }
  .cloud-pill.error   { color: #991b1b; background: #fee2e2; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  .btn { padding: 9px 16px; border-radius: 10px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; transition: all .2s; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); }
  .btn-outline { background: #fff; color: var(--text); border: 1px solid var(--border); }
  .btn-outline:hover { border-color: var(--primary); color: var(--primary); }
  .btn-wa { background: var(--wa); color: #fff; }
  .btn-danger { background: #fee2e2; color: var(--danger); }
  .btn-danger:hover { background: var(--danger); color: #fff; }
  .btn-sm { padding: 6px 10px; font-size: 12px; }
  .content { padding: 22px; flex: 1; }
  .card { background: var(--card); border-radius: 14px; border: 1px solid var(--border); padding: 20px; margin-bottom: 18px; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
  .card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .card-head h2 { font-size: 16px; font-weight: 700; flex: 1; }
  .card-head .ico { font-size: 20px; }
  .grid { display: grid; gap: 16px; }
  .grid-2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  .grid-4 { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
  .stat { background: var(--card); border-radius: 14px; padding: 18px; border: 1px solid var(--border); display: flex; align-items: center; gap: 14px; transition: transform .2s; }
  .stat:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,.07); }
  .stat-ico { width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; flex-shrink: 0; }
  .stat-ico.green { background: var(--primary-light); }
  .stat-ico.amber { background: var(--accent-light); }
  .stat-ico.blue { background: #dbeafe; }
  .stat-ico.purple { background: #ede9fe; }
  .stat-val { font-size: 22px; font-weight: 800; line-height: 1.1; }
  .stat-lbl { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .form-row { display: grid; gap: 14px; margin-bottom: 14px; }
  .form-row.cols-2 { grid-template-columns: 1fr 1fr; }
  .form-row.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
  .form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: .4px; }
  input[type="text"], input[type="number"], input[type="time"], input[type="date"], input[type="tel"], input[type="password"], select, textarea {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 9px; font-size: 14px; font-family: inherit; background: #fff; color: var(--text);
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(13,148,136,.12); }
  textarea { resize: vertical; min-height: 70px; }
  .tbl-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid var(--border); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; background: #fff; }
  th { background: #f8fafc; text-align: left; padding: 11px 12px; font-weight: 700; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .3px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 10px 12px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
  tr:hover td { background: #f8fafc; }
  td input, td select { padding: 7px 9px; font-size: 13px; }
  .col-nama { min-width: 200px; }
  .col-nama input { min-width: 180px; }
  /* Laporan UPA: keep attendance status readable on mobile */
  #upa_absensi { min-width: 600px; }
  #upa_absensi td:nth-child(1), #upa_absensi th:nth-child(1) { min-width: 150px; }
  #upa_absensi td:nth-child(2), #upa_absensi th:nth-child(2) { min-width: 125px; }
  #upa_absensi td:nth-child(2) select[data-upa-status] { min-width: 110px; width: 110px; white-space: nowrap; }
  #upa_absensi td:nth-child(3), #upa_absensi th:nth-child(3) { min-width: 190px; }
  .mini-btn { background: none; border: none; cursor: pointer; font-size: 15px; padding: 4px 6px; border-radius: 6px; }
  .mini-btn:hover { background: var(--bg); }
  .tag { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 700; background: var(--primary-light); color: var(--primary-dark); }
  .tag.amber { background: var(--accent-light); color: #92400e; }
  .rem-item { display: flex; align-items: center; gap: 14px; padding: 13px 15px; border-radius: 11px; background: #fff; border: 1px solid var(--border); margin-bottom: 10px; }
  .rem-item.soon { border-color: var(--accent); background: #fffbeb; }
  .rem-ico { width: 42px; height: 42px; border-radius: 11px; display: grid; place-items: center; font-size: 20px; background: var(--primary-light); flex-shrink: 0; }
  .rem-body { flex: 1; min-width: 0; }
  .rem-title { font-weight: 700; font-size: 14px; }
  .rem-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .rem-count { font-size: 12px; font-weight: 800; color: var(--primary-dark); white-space: nowrap; }
  .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; max-width: 360px; }
  .toast { background: #fff; border-left: 4px solid var(--primary); border-radius: 12px; padding: 14px 16px; box-shadow: 0 10px 30px rgba(0,0,0,.15); display: flex; gap: 12px; align-items: flex-start; animation: slideIn .35s ease; }
  .toast.warn { border-left-color: var(--accent); }
  .toast.danger { border-left-color: var(--danger); }
  .toast.cloud { border-left-color: #3b82f6; }
  .toast .t-ico { font-size: 22px; }
  .toast .t-title { font-weight: 700; font-size: 13px; }
  .toast .t-msg { font-size: 12px; color: var(--muted); margin-top: 2px; }
  @keyframes slideIn { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  .progress { height: 8px; background: #e2e8f0; border-radius: 5px; overflow: hidden; margin-top: 6px; }
  .progress > div { height: 100%; border-radius: 5px; background: linear-gradient(90deg, var(--primary), var(--accent)); }
  .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,.55); display: none; align-items: center; justify-content: center; z-index: 9998; padding: 20px; }
  .modal-overlay.show { display: flex; }
  .modal { background: #fff; border-radius: 16px; max-width: 560px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 24px; }
  .modal h3 { font-size: 17px; margin-bottom: 16px; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
  .empty { text-align: center; padding: 40px 20px; color: var(--muted); }
  .empty .e-ico { font-size: 46px; margin-bottom: 10px; opacity: .55; }
  .section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  .section-head h2 { font-size: 20px; font-weight: 800; }
  .section-head .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .mut-table td input { width: 100%; text-align: center; padding: 4px; font-size: 12px; }
  .mut-table th { text-align: center; font-size: 11px; padding: 8px 4px; }
  .mut-table td:first-child { text-align: left; font-weight: 600; }
  .mut-table th:first-child, .mut-table td:first-child { position: sticky; left: 0; background: #fff; z-index: 2; min-width: 200px; }
  .mut-table th:first-child { background: #f8fafc; }
  .report-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
  .report-card { background: #fff; border-radius: 14px; border: 1px solid var(--border); padding: 22px; cursor: pointer; transition: all .25s; text-align: center; }
  .report-card:hover { transform: translateY(-4px); box-shadow: 0 12px 28px rgba(0,0,0,.1); border-color: var(--primary); }
  .report-card .r-ico { font-size: 38px; margin-bottom: 12px; display: block; }
  .report-card .r-title { font-weight: 800; font-size: 15px; margin-bottom: 6px; }
  .report-card .r-desc { font-size: 12px; color: var(--muted); line-height: 1.5; }
  .info-box { background: #eff6ff; border-left: 4px solid #3b82f6; padding: 14px; border-radius: 8px; font-size: 13px; line-height: 1.6; margin-bottom: 14px; }
  .info-box.warn { background: #fffbeb; border-color: var(--accent); }
  .info-box.success { background: #f0fdf4; border-color: var(--success); }
  .info-box code { background: rgba(0,0,0,.06); padding: 2px 6px; border-radius: 4px; font-size: 11px; word-break: break-all; }
  @media print {
    body * { visibility: hidden; }
    #printArea, #printArea * { visibility: visible; }
    #printArea { position: absolute; left: 0; top: 0; width: 100%; background: #fff; padding: 20px; }
  }
  #printArea { display: none; }
  @media (max-width: 900px) {
    .sidebar { transform: translateX(-100%); }
    .sidebar.open { transform: translateX(0); }
    .main { margin-left: 0; }
    .menu-btn { display: block; }
    .form-row.cols-2, .form-row.cols-3 { grid-template-columns: 1fr; }
    .content { padding: 14px; }
    .topbar h1 { font-size: 15px; }
    .btn .btn-text { display: none; }
  }
</style>
</head>

  settings: { reminderEnabled: true, reminderMinutes: 30 }
};

let state = loadState();
// Hilangkan program dokumentasi usroh dari data lama maupun data awal.
state.progja = (state.progja || []).filter(p => !/dokumentasi.*usroh|dokumentasi liqo usroh/i.test(p.nama || ''));
if (!Array.isArray(state.laporanUPA)) state.laporanUPA = [];

function loadState() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return JSON.parse(JSON.stringify(DEFAULT_STATE));
    return deepMerge(JSON.parse(JSON.stringify(DEFAULT_STATE)), JSON.parse(raw));
  } catch(e) { return JSON.parse(JSON.stringify(DEFAULT_STATE)); }
}
function deepMerge(base, over) {
  for (const k in over) {
    if (over[k] && typeof over[k] === 'object' && !Array.isArray(over[k])) {
      base[k] = deepMerge(base[k] || {}, over[k]);
    } else { base[k] = over[k]; }
  }
  return base;
}

let syncTimer = null;
function saveState() {
  localStorage.setItem(LS_KEY, JSON.stringify(state));
  if (state.cloud.autoSync && state.cloud.binId && state.cloud.masterKey) {
    clearTimeout(syncTimer);
    syncTimer = setTimeout(() => syncToCloud(true), 3000);
  }
}

/* ============ CLOUD (JSONBin.io) ============ */
const JSONBIN_BASE = 'https://api.jsonbin.io/v3/b';

function setCloudStatus(s) {
  state.cloud.status = s;
  const pill = document.getElementById('cloudPill');
  const text = document.getElementById('cloudText');
  if (!pill || !text) return;
  pill.className = 'cloud-pill ' + s;
  text.textContent = { offline:'Offline', syncing:'Syncing...', online:'Online', error:'Error' }[s] || s;
}

function cloudHeaders() {
  return {
    'Content-Type': 'application/json',
    'X-Master-Key': state.cloud.masterKey,
    'X-Bin-Meta': 'false'
  };
}

async function testCloud() {
  const bin = (document.getElementById('cloud_bin') || {}).value.trim();
  const key = (document.getElementById('cloud_key') || {}).value.trim();
  if (!bin || !key) { toast('Kosong', 'Isi Bin ID & Master Key dulu.', 'warn'); return; }
  setCloudStatus('syncing');
  try {
    const res = await fetch(`${JSONBIN_BASE}/${bin}/latest`, {
      headers: { 'X-Master-Key': key, 'X-Bin-Meta': 'false' }
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    await res.json();
    setCloudStatus('online');
    toast('Berhasil', 'Koneksi ke JSONBin OK! ✅', 'cloud');
  } catch(e) {
    setCloudStatus('error');
    toast('Gagal', 'Cek Bin ID / Master Key. Error: ' + e.message, 'danger');
  }
}
window.testCloud = testCloud;

async function syncFromCloud(silent) {
  if (!state.cloud.binId || !state.cloud.masterKey) {
    if (!silent) toast('Belum Diatur', 'Isi Bin ID & Master Key di Pengaturan.', 'warn');
    return false;
  }
  setCloudStatus('syncing');
  try {
    const res = await fetch(`${JSONBIN_BASE}/${state.cloud.binId}/latest`, {
      headers: { 'X-Master-Key': state.cloud.masterKey, 'X-Bin-Meta': 'false' }
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const record = await res.json();
    const payload = record && record.data ? record.data : record;
    if (!payload || !payload.appData) {
      setCloudStatus('online');
      if (!silent) toast('Cloud Kosong', 'Belum ada data tersimpan. Klik "Kirim ke Cloud" untuk upload.', 'warn');
      return false;
    }
    applyCloudData(payload.appData);
    state.cloud.lastSync = new Date().toISOString();
    localStorage.setItem(LS_KEY, JSON.stringify(state));
    setCloudStatus('online');
    if (!silent) toast('Berhasil', 'Data ditarik dari cloud.', 'cloud');
    renderPage();
    return true;
  } catch(e) {
    setCloudStatus('error');
    if (!silent) toast('Gagal Tarik', e.message, 'danger');
    return false;
  }
}

async function syncToCloud(silent) {
  if (!state.cloud.binId || !state.cloud.masterKey) {
    if (!silent) toast('Belum Diatur', 'Isi Bin ID & Master Key di Pengaturan.', 'warn');
    return false;
  }
  setCloudStatus('syncing');
  const payload = {
    app: 'raker-upa',
    version: 3,
    updatedAt: new Date().toISOString(),
    appData: state
  };
  try {
    const res = await fetch(`${JSONBIN_BASE}/${state.cloud.binId}`, {
      method: 'PUT',
      headers: cloudHeaders(),
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    state.cloud.lastSync = new Date().toISOString();
    localStorage.setItem(LS_KEY, JSON.stringify(state));
    setCloudStatus('online');
    if (!silent) toast('Berhasil', 'Data terkirim ke cloud. ☁️', 'cloud');
    return true;
  } catch(e) {
    setCloudStatus('error');
    if (!silent) toast('Gagal Kirim', e.message, 'danger');
    return false;
  }
}

function applyCloudData(data) {
  if (!data || typeof data !== 'object') return;
  // Identitas
  if (data.identitas) Object.assign(state.identitas, data.identitas);
  // WA
  if (data.wa) Object.assign(state.wa, data.wa);
  // Preserve cloud config kita sendiri
  if (data.cloud) {
    const myBin = state.cloud.binId;
    const myKey = state.cloud.masterKey;
    Object.assign(state.cloud, data.cloud);
    state.cloud.binId = myBin;
    state.cloud.masterKey = myKey;
  }
  // Array
  if (Array.isArray(data.anggota))    state.anggota = data.anggota;
  if (Array.isArray(data.progja))     state.progja = data.progja;
  if (Array.isArray(data.materi))     state.materi = data.materi;
  if (Array.isArray(data.kader))      state.kader = data.kader;
  if (Array.isArray(data.laporanUPA)) state.laporanUPA = data.laporanUPA;
  if (data.statistik) {
    if (Array.isArray(data.statistik.usroh))  state.statistik.usroh = data.statistik.usroh;
    if (Array.isArray(data.statistik.target)) state.statistik.target = data.statistik.target;
  }
  if (data.mutabaah) {
    state.mutabaah = deepMerge(state.mutabaah, data.mutabaah);
  }
  if (data.settings) Object.assign(state.settings, data.settings);
}

function toast(title, msg, type='') {
  const c = document.getElementById('toasts');

  el.className = 'toast ' + type;

  el.innerHTML = `<div class="t-ico">${ico}</div><div style="flex:1"><div class="t-title">${esc(title)}</div><div class="t-msg">${esc(msg)}</div></div>`;

}

/* ============ REMINDER ============ */
function getNextOccurrence(hari, jam) {
  if (!hari || !jam) return null;
  const td = DAYS.indexOf(hari);
  if (td < 0) return null;
  const [h, mi] = jam.split(':').map(Number);
  if (isNaN(h)) return null;
  const now = new Date();
  const next = new Date(now);
  next.setHours(h, mi || 0, 0, 0);
  let diff = (td - now.getDay() + 7) % 7;
  if (diff === 0 && next <= now) diff = 7;
  next.setDate(now.getDate() + diff);
  return next;
}
function formatDiff(ms) {
  const min = Math.round(ms / 60000);
  if (min < 60) return `${min} menit`;
  const hr = Math.floor(min / 60);
  if (hr < 24) return `${hr} jam ${min % 60}m`;
  const d = Math.floor(hr / 24);
  return `${d} hari ${hr % 24}j`;
}
function getUpcomingActivities() {
  const now = new Date();
  const list = [];
  state.progja.forEach(p => {
    const next = getNextOccurrence(p.hari, p.jam);
    if (!next) return;
    const diff = next - now;
    list.push({ ...p, next, diff, soon: diff < 3600000, label: formatDiff(diff) });
  });
  list.sort((a, b) => a.diff - b.diff);
  return list;
}

  c.innerHTML = `

    <td><input type="text" data-upa-reason="${esc(a.id)}" placeholder="Alasan tidak hadir" disabled></td>
  </tr>`).join('');
  absensiBody.querySelectorAll('[data-upa-status]').forEach(sel => {
    sel.onchange = () => {
      const reason = absensiBody.querySelector(`[data-upa-reason="${sel.dataset.upaStatus}"]`);
      reason.disabled = sel.value !== 'Tidak hadir';
      if (reason.disabled) reason.value = '';
    };
  });
  // Autosave draft form values locally while typing/changing fields.
  const draftKey = 'upaDraft';
  const saveDraft = () => {
    const draft = {
      tanggal: document.getElementById('upa_tanggal').value,
      tempat: document.getElementById('upa_tempat').value,
      materi: document.getElementById('upa_materi').value,
      infaq: document.getElementById('upa_infaq').value,
      absensi: state.anggota.map(a => ({
        anggotaId: a.id,
        status: absensiBody.querySelector(`[data-upa-status="${a.id}"]`)?.value || 'Hadir',
        alasan: absensiBody.querySelector(`[data-upa-reason="${a.id}"]`)?.value || ''
      }))
    };
    try { localStorage.setItem('raker_upa_jsonbin_v1_' + draftKey, JSON.stringify(draft)); } catch (_) {}
  };
  saveDraftIfReady = saveDraft;
  ['upa_tanggal','upa_tempat','upa_materi','upa_infaq'].forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener('input', saveDraft);
    el.addEventListener('change', saveDraft);
  });
  absensiBody.querySelectorAll('select, input').forEach(el => {
    el.addEventListener('input', saveDraft);
    el.addEventListener('change', saveDraft);
  });

  // Restore a saved draft when opening this page.
  try {
    const draft = JSON.parse(localStorage.getItem('raker_upa_jsonbin_v1_' + draftKey) || 'null');
    if (draft) {
      if (draft.tanggal) document.getElementById('upa_tanggal').value = draft.tanggal;
      if (draft.tempat) document.getElementById('upa_tempat').value = draft.tempat;
      if (draft.materi) document.getElementById('upa_materi').value = draft.materi;
      if (draft.infaq !== undefined) document.getElementById('upa_infaq').value = formatRupiahInput(draft.infaq);
      (draft.absensi || []).forEach(a => {
        const sel = absensiBody.querySelector(`[data-upa-status="${a.anggotaId}"]`);
        const reason = absensiBody.querySelector(`[data-upa-reason="${a.anggotaId}"]`);
        if (sel) { sel.value = a.status || 'Hadir'; }
        if (reason) { reason.value = a.alasan || ''; reason.disabled = sel?.value !== 'Tidak hadir'; }
      });
    }
  } catch (_) {}

  document.getElementById('saveUPA').onclick = () => {
    const tanggal = document.getElementById('upa_tanggal').value;
    if (!tanggal) { alert('Tanggal wajib diisi.'); return; }
    const absensi = state.anggota.map(a => ({
      anggotaId: a.id, nama: a.nama,
      status: absensiBody.querySelector(`[data-upa-status="${a.id}"]`).value,
      alasan: absensiBody.querySelector(`[data-upa-reason="${a.id}"]`).value.trim()
    }));
    records.unshift({
      id: uid(), tanggal, tempat: document.getElementById('upa_tempat').value.trim(),
      materi: document.getElementById('upa_materi').value.trim(),
      infaq: Math.max(0, Number(digitsOnly(document.getElementById('upa_infaq').value)) || 0), absensi
    });
    saveState(); try { localStorage.removeItem('raker_upa_jsonbin_v1_upaDraft'); } catch (_) {} toast('Tersimpan', 'Laporan UPA berhasil disimpan.'); renderLaporanUPA(c);
  };
  c.querySelectorAll('[data-upa-del]').forEach(btn => btn.onclick = () => {
    if (!confirm('Hapus laporan ini?')) return;
    records.splice(Number(btn.dataset.upaDel), 1); saveState(); renderLaporanUPA(c);
  });
  document.getElementById('exportUPAExcel').onclick = () => {
    if (!records.length) { alert('Belum ada laporan UPA untuk diekspor.'); return; }
    const rows = [['Tanggal','Tempat','Materi','Infaq (Rp)','Nama Anggota','Absensi','Alasan Tidak Hadir']];
    records.forEach(r => {
      if (r.absensi && r.absensi.length) {
        r.absensi.forEach(a => rows.push([r.tanggal, r.tempat || '', r.materi || '', Number(r.infaq || 0), a.nama || '', a.status || '', a.alasan || '']));
      } else {
        rows.push([r.tanggal, r.tempat || '', r.materi || '', Number(r.infaq || 0), '', '', '']);
      }
    });
    const csv = '\\ufeff' + rows.map(row => row.map(v => '"' + String(v ?? '').replace(/"/g, '""') + '"').join(';')).join('\\r\\n');
    const blob = new Blob([csv], { type: 'application/vnd.ms-excel;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'Laporan_UPA_' + new Date().toISOString().slice(0,10) + '.csv';
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    toast('Berhasil', 'File laporan UPA berhasil diekspor. Buka file dengan Excel.');
  };
  document.getElementById('sendUPAWA').onclick = () => {
    if (!records.length) { alert('Belum ada laporan UPA untuk dikirim.'); return; }
    const text = records.map(r => {
      const hadir = (r.absensi || []).filter(a => a.status === 'Hadir');
      const tidak = (r.absensi || []).filter(a => a.status === 'Tidak hadir');
      const daftarAbsensi = (r.absensi || []).map((a, i) =>
        `${i + 1}. ${a.nama || '-'}: ${a.status === 'Hadir' ? '✅️' : '❌️'}${a.status === 'Tidak hadir' && a.alasan ? ' (Alasan: ' + a.alasan + ')' : ''}`
      ).join('\\n');
      return `*Laporan UPA*\\nTanggal : ${r.tanggal || '-'}\\nTempat : ${r.tempat || '-'}\\nInfaq : Rp ${Number(String(r.infaq || 0).replace(/\\D/g, '') || 0).toLocaleString('id-ID')}\\nMateri : ${r.materi || '-'}\\nAbsensi :\\n${daftarAbsensi || '-'}\\nRekap : ${hadir.length} hadir, ${tidak.length} tidak hadir`;
    }).join('\\n\\n');
    window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
  };
  document.getElementById('printUPA').onclick = () => {
    const rows = records.map(r => `<section style="margin-bottom:22px"><h3>${esc(r.tanggal)} — ${esc(r.tempat)||'-'}</h3><p><b>Materi:</b> ${esc(r.materi)||'-'}</p><p><b>Infaq:</b> Rp ${Number(r.infaq||0).toLocaleString('id-ID')}</p><table style="width:100%;border-collapse:collapse" border="1" cellpadding="6"><tr><th>Nama</th><th>Status</th><th>Alasan</th></tr>${(r.absensi||[]).map(a=>`<tr><td>${esc(a.nama)}</td><td>${esc(a.status)}</td><td>${esc(a.alasan)||'-'}</td></tr>`).join('')}</table></section>`).join('');
    const area = document.getElementById('printArea');
    area.innerHTML = `<h2>Laporan UPA — ${esc(state.identitas.nama)}</h2>${rows || '<p>Belum ada laporan.</p>'}`;
    area.style.display = 'block'; window.print(); area.style.display = 'none';
  };
}

/* ============ WHATSAPP ============ */
function openWA(text) {
  const num = state.wa.defaultNumber || '';
  const url = num ? `https://wa.me/${num}?text=${encodeURIComponent(text)}` : `https://wa.me/?text=${encodeURIComponent(text)}`;
  window.open(url, '_blank');
}
function sendWAStruktur() {
  let msg = `*📋 STRUKTUR ANGGOTA*\n*UPA ${state.identitas.nama}*\n━━━━━━━━━━━━━━━━━━━━\n\n`;
  state.anggota.forEach((a,i) => {
    msg += `${i+1}. *${a.nama||'(belum diisi)'}*\n   Amanah: ${a.amanah}\n`;
    if (a.idSik) msg += `   ID SIK: ${a.idSik}\n`;
    if (a.hp) msg += `   HP: ${a.hp}\n`;
    msg += `\n`;
  });
  msg += `━━━━━━━━━━━━━━━━━━━━\nTotal: ${state.anggota.length} anggota\n${formatDateID(new Date())}`;
  openWA(msg);
}
function sendWAKader() {
  if (!state.kader.length) { toast('Kosong', 'Belum ada data kader.', 'warn'); return; }
  let msg = `*👥 DATA KADER*\n*UPA ${state.identitas.nama}*\n━━━━━━━━━━━━━━━━━━━━\n\n`;
  state.kader.forEach((k,i) => {
    msg += `${i+1}. *${k.nama||'(tanpa nama)'}*\n`;
    if (k.naqib) msg += `   Naqib: ${k.naqib}\n`;
    if (k.jenjang) msg += `   Jenjang: ${k.jenjang}\n`;
    if (k.hp) msg += `   HP: ${k.hp}\n`;
    msg += `\n`;
  });
  msg += `━━━━━━━━━━━━━━━━━━━━\nTotal: ${state.kader.length} kader`;
  openWA(msg);
}
function sendWAReminder() {
  const list = getUpcomingActivities();
  if (!list.length) { toast('Kosong', 'Belum ada agenda.', 'warn'); return; }
  let msg = `*🔔 REMINDER KEGIATAN*\n*UPA ${state.identitas.nama}*\n━━━━━━━━━━━━━━━━━━━━\n\nAssalamu'alaikum,\n\nAgenda terdekat:\n\n`;
  list.slice(0,10).forEach(a => {
    msg += `${a.ico||'📌'} *${a.nama}*\n   🗓️ ${a.hari}, ${a.jam}\n   ⏳ ${a.label} lagi\n   👤 PIC: ${a.pic}\n\n`;
  });
  msg += `━━━━━━━━━━━━━━━━━━━━\nJazakumullahu khairan 🤲`;
  openWA(msg);
}
function sendWASingle(id) {
  const p = state.progja.find(x => x.id === id);
  if (!p) return;
  const next = getNextOccurrence(p.hari, p.jam);
  if (!next) return;
  const diff = next - new Date();
  openWA(`*🔔 PENGINGAT*\n\n${p.ico||'📌'} *${p.nama}*\n🗓️ ${p.hari}, ${p.jam}\n⏳ ${formatDiff(diff)} lagi\n👤 PIC: ${p.pic}\n\nBarakallahu fiikum 🤲`);
}
function sendWAStatistik() {
  const usroh = state.statistik.usroh;
  const total = usroh.reduce((s,x)=>s+(+x.jumlah||0),0);
  let msg = `*📊 STATISTIK USROH*\n*UPA ${state.identitas.nama}*\n━━━━━━━━━━━━━━━━━━━━\n\n*Komposisi Kader:*\n`;
  usroh.forEach(u => { msg += `• ${u.mustawa}: *${u.jumlah}* orang\n`; });
  msg += `\n*Total: ${total} kader*\n\n━━━━━━━━━━━━━━━━━━━━\n${formatDateID(new Date())}`;
  openWA(msg);
}
function sendWAMutabaah() {
  const m = state.mutabaah;
  let msg = `*✅ MUTABAAH YAUMIAH*\n*UPA ${state.identitas.nama}*\n━━━━━━━━━━━━━━━━━━━━\nTanggal: ${m.tanggal}\nPekan: ${m.pekan}\n\n*Anggota:* ${m.members.join(', ')}\n\n`;
  m.agenda.forEach((a, i) => {
    const scores = m.members.map((_, ci) => m.values[i+'-'+ci] || '-');
    msg += `${i+1}. ${a.nama} (target: ${a.target||'-'})\n   [${scores.join('|')}]\n`;
  });
  msg += `\n━━━━━━━━━━━━━━━━━━━━\nBarakallahu fiikum 🤲`;
  openWA(msg);
}

        <div style="margin-bottom:10px"><b>2.</b> Tap <b>Bins</b> → <b>Create Bin</b> → paste: <code>{"app":"raker-upa","data":null}</code> → <b>Create</b></div>
        <div style="margin-bottom:10px"><b>3.</b> Copy <b>BIN ID</b> yang muncul (di URL, format seperti <code>65abc123...</code>)</div>
        <div style="margin-bottom:10px"><b>4.</b> Tap foto profil → <b>API Keys</b> → copy <b>X-MASTER-KEY</b></div>
        <div><b>5.</b> Paste keduanya di bawah 👇</div>
      </div>
    </div>
    ` : `
    <div class="info-box success">
      <b>✅ Terhubung ke JSONBin Cloud</b><br>
      Data disinkronkan ke cloud. Bagi Bin ID & Master Key ke pengurus lain agar mereka bisa akses data yang sama.
    </div>
    `}

    <div class="card">
      <div class="card-head"><span class="ico">🔑</span><h2>Kredensial JSONBin</h2></div>
      <div class="form-row">
        <div class="form-group"><label>Bin ID</label>
          <input type="text" id="cloud_bin" value="${esc(state.cloud.binId)}" placeholder="65abc123def456..."></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Master Key (X-MASTER-KEY)</label>
          <input type="password" id="cloud_key" value="${esc(state.cloud.masterKey)}" placeholder="$2b$10$..."></div>
      </div>
      <div class="form-row cols-2">
        <div class="form-group"><label>Auto-Sync (setelah edit)</label>
          <select id="cloud_auto">
            <option value="1" ${state.cloud.autoSync?'selected':''}>Aktif (rekomendasi)</option>
            <option value="0" ${!state.cloud.autoSync?'selected':''}>Nonaktif</option>
          </select></div>
      </div>
      <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:8px">
        <button class="btn btn-outline" id="btnTest">🔌 Test Koneksi</button>
        <button class="btn btn-primary" id="btnSaveCloud">💾 Simpan</button>
        <button class="btn btn-primary" id="btnUpload">⬆️ Kirim ke Cloud</button>
        <button class="btn btn-primary" id="btnDownload">⬇️ Tarik dari Cloud</button>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><span class="ico">📤</span><h2>Export Laporan</h2></div>
      <div style="display:flex; gap:10px; flex-wrap:wrap">
        <button class="btn btn-primary" onclick="exportExcel()">📊 Excel</button>
        <button class="btn btn-primary" onclick="exportPDF()">📄 PDF</button>
        <button class="btn btn-wa" onclick="goPage('laporan')">📱 Laporan WA</button>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><span class="ico">💾</span><h2>Backup Lokal</h2></div>
      <p style="font-size:13px; color:var(--muted); margin-bottom:14px">Backup data ke file JSON di HP Anda.</p>
      <div style="display:flex; gap:10px; flex-wrap:wrap">
        <button class="btn btn-primary" id="btnBackup">⬇️ Backup JSON</button>
        <label class="btn btn-outline" style="cursor:pointer">⬆️ Restore JSON
          <input type="file" id="fileRestore" accept=".json" style="display:none"></label>
        <button class="btn btn-danger" id="btnReset">🗑️ Reset Semua</button>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><span class="ico">🔔</span><h2>Izin Notifikasi Browser</h2></div>
      <p style="font-size:13px; color:var(--muted); margin-bottom:10px">Status: <b>${('Notification' in window) ? Notification.permission : 'tidak didukung'}</b></p>
      <button class="btn btn-primary" onclick="requestNotifPerm()">🔔 Minta Izin</button>
    </div>
  `;

  const binEl = document.getElementById('cloud_bin');
  const keyEl = document.getElementById('cloud_key');

  document.getElementById('btnTest').onclick = testCloud;
  document.getElementById('btnSaveCloud').onclick = () => {
    state.cloud.binId = binEl.value.trim();
    state.cloud.masterKey = keyEl.value.trim();
    state.cloud.autoSync = document.getElementById('cloud_auto').value === '1';
    saveState();
    toast('Tersimpan', 'Kredensial cloud disimpan.');
    renderPage();
  };
  document.getElementById('btnUpload').onclick = () => {
    state.cloud.binId = binEl.value.trim();
    state.cloud.masterKey = keyEl.value.trim();
    state.cloud.autoSync = document.getElementById('cloud_auto').value === '1';
    saveState();
    syncToCloud(false);
  };
  document.getElementById('btnDownload').onclick = () => {
    state.cloud.binId = binEl.value.trim();
    state.cloud.masterKey = keyEl.value.trim();
    state.cloud.autoSync = document.getElementById('cloud_auto').value === '1';
    saveState();
    syncFromCloud(false);
  };
  document.getElementById('btnBackup').onclick = () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `backup-raker-upa-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    toast('Berhasil', 'Backup diunduh.');
  };
  document.getElementById('fileRestore').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const imp = JSON.parse(r.result);
        const myBin = state.cloud.binId, myKey = state.cloud.masterKey;
        state = deepMerge(JSON.parse(JSON.stringify(DEFAULT_STATE)), imp);
        state.cloud.binId = myBin; state.cloud.masterKey = myKey;
        saveState(); toast('Berhasil', 'Data dipulihkan.'); renderPage();
      } catch(err) { toast('Gagal', 'File tidak valid.', 'danger'); }
    };
    r.readAsText(f);
  };
  document.getElementById('btnReset').onclick = () => {
    if (!confirm('Yakin reset SEMUA data?')) return;
    const bin = state.cloud.binId, key = state.cloud.masterKey;
    state = JSON.parse(JSON.stringify(DEFAULT_STATE));
    state.cloud.binId = bin; state.cloud.masterKey = key;
    saveState();
    toast('Direset', 'Semua data telah direset.');
    goPage('dashboard');
  };
}

function requestNotifPerm() {
  if (!('Notification' in window)) { toast('Tidak Didukung', 'Browser tidak mendukung notif.', 'danger'); return; }
  Notification.requestPermission().then(p => {
    if (p === 'granted') {
      toast('Berhasil', 'Notifikasi diaktifkan.');
      new Notification('🕌 Raker UPA', { body: 'Notifikasi siap.' });
    } else {
      toast('Ditolak', 'Buka pengaturan browser untuk izinkan.', 'danger');
    }
    renderPage();
  });
}
window.requestNotifPerm = requestNotifPerm;

/* ============ REMINDER ENGINE ============ */
const notifiedKeys = new Set();
function checkReminders(silent) {
  if (!state.settings.reminderEnabled) return;
  const now = new Date();
  const ahead = (state.settings.reminderMinutes || 30) * 60000;
  let upcomingCount = 0;
  state.progja.forEach(p => {
    const next = getNextOccurrence(p.hari, p.jam);
    if (!next) return;
    const diff = next - now;
    if (diff > 0 && diff <= ahead) upcomingCount++;
    if (diff > 0 && diff <= ahead) {
      const key = p.id + '|' + next.toISOString().slice(0, 13);
      if (!notifiedKeys.has(key)) {
        notifiedKeys.add(key);
        if (!silent) {
          toast(`⏰ ${p.nama}`, `Akan dimulai dalam ${formatDiff(diff)} (${p.hari}, ${p.jam})`, 'warn');
          if ('Notification' in window && Notification.permission === 'granted') {
            try { new Notification(`⏰ ${p.nama}`, { body: `Dalam ${formatDiff(diff)} — ${p.hari}, ${p.jam}` }); } catch(e){}
          }
        }
      }
    }
  });
  const badge = document.getElementById('bellBadge');
  if (badge) {
    if (upcomingCount > 0) { badge.textContent = upcomingCount; badge.classList.remove('hidden'); }
    else badge.classList.add('hidden');
  }
}

/* ============ INIT ============ */
document.getElementById('menuBtn').onclick = () => document.getElementById('sidebar').classList.toggle('open');
document.getElementById('bellBtn').onclick = () => goPage('reminder');
document.getElementById('waReportBtn').onclick = () => goPage('laporan');
document.getElementById('cloudPill').onclick = () => {
  if (!state.cloud.binId || !state.cloud.masterKey) goPage('pengaturan');
  else syncFromCloud(false);
};

renderNav();
renderPage();
checkReminders(true);
setInterval(() => checkReminders(false), 30000);

// Init cloud status
if (state.cloud.binId && state.cloud.masterKey) {
  setCloudStatus('online');
  // Auto-fetch saat buka
  setTimeout(() => syncFromCloud(true), 1500);
} else {
  setCloudStatus('offline');
}

// Auto-poll (kalau diaktifkan)
setInterval(() => {
  if (state.cloud.binId && state.cloud.masterKey) {
    // Cek perubahan dari user lain (silent)
    syncFromCloud(true);
  }
}, 60000);

setTimeout(() => toast('🕌 Selamat Datang', `Sistem Raker UPA ${state.identitas.nama}.`), 800);
</script>
</body>
</html>
