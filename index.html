<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UPA — Online</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --primary: #0d9488; --primary-dark: #0f766e; --primary-light: #ccfbf1;
    --accent: #f59e0b; --accent-light: #fef3c7;
    --bg: #f1f5f9; --card: #ffffff; --text: #0f172a; --muted: #64748b;
    --border: #e2e8f0; --danger: #ef4444; --success: #10b981;
    --wa: #25D366; --sidebar: #0f2e2b; --sidebar-hover: #134e4a;
  }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
  .app { display: flex; min-height: 100vh; }
  .sidebar { width: 250px; background: var(--sidebar); color: #e2e8f0; display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 100; transition: transform .3s; }
  .brand { display: flex; align-items: center; gap: 12px; padding: 20px 18px; border-bottom: 1px solid rgba(255,255,255,.08); }
  .brand-logo { font-size: 28px; background: linear-gradient(135deg, var(--primary), var(--accent)); width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; box-shadow: 0 4px 12px rgba(13,148,136,.4); }
  .brand-title { font-weight: 800; font-size: 15px; color: #fff; }
  .brand-sub { font-size: 12px; color: #94a3b8; }
  nav { flex: 1; padding: 12px 10px; overflow-y: auto; }
  .nav-item { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 10px; cursor: pointer; margin-bottom: 3px; font-size: 14px; font-weight: 500; color: #cbd5e1; transition: all .2s; user-select: none; }
  .nav-item:hover { background: var(--sidebar-hover); color: #fff; }
  .nav-item.active { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; box-shadow: 0 4px 12px rgba(13,148,136,.35); }
  .nav-item .ico { font-size: 18px; width: 22px; text-align: center; }
  .sidebar-footer { padding: 14px; font-size: 11px; color: #64748b; text-align: center; border-top: 1px solid rgba(255,255,255,.08); }
  .main { flex: 1; margin-left: 250px; display: flex; flex-direction: column; min-width: 0; }
  .topbar { background: #fff; padding: 14px 22px; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50; flex-wrap: wrap; }
  .menu-btn { display: none; background: none; border: none; font-size: 22px; cursor: pointer; color: var(--text); }
  .topbar h1 { font-size: 18px; font-weight: 700; flex: 1; min-width: 100px; }
  .topbar-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .icon-btn { position: relative; background: var(--bg); border: 1px solid var(--border); width: 40px; height: 40px; border-radius: 10px; font-size: 18px; cursor: pointer; display: grid; place-items: center; transition: all .2s; }
  .icon-btn:hover { background: var(--primary-light); border-color: var(--primary); }
  .icon-btn .badge { position: absolute; top: -4px; right: -4px; background: var(--danger); color: #fff; font-size: 10px; font-weight: 700; min-width: 18px; height: 18px; border-radius: 9px; display: grid; place-items: center; padding: 0 4px; border: 2px solid #fff; }
  .badge.hidden { display: none; }
  .cloud-pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; background: var(--bg); border: 1px solid var(--border); cursor: pointer; transition: all .2s; }
  .cloud-pill:hover { transform: translateY(-1px); box-shadow: 0 4px 10px rgba(0,0,0,.08); }
  .cloud-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: #94a3b8; }
  .cloud-pill.syncing .dot { background: var(--accent); animation: pulse 1s infinite; }
  .cloud-pill.online  .dot { background: var(--success); }
  .cloud-pill.error   .dot { background: var(--danger); }
  .cloud-pill.offline { color: #64748b; }
  .cloud-pill.syncing { color: #b45309; background: var(--accent-light); }
  .cloud-pill.online  { color: #065f46; background: #d1fae5; }
  .cloud-pill.error   { color: #991b1b; background: #fee2e2; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  .btn { padding: 9px 16px; border-radius: 10px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; transition: all .2s; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); }
  .btn-outline { background: #fff; color: var(--text); border: 1px solid var(--border); }
  .btn-outline:hover { border-color: var(--primary); color: var(--primary); }
  .btn-wa { background: var(--wa); color: #fff; }
  .btn-danger { background: #fee2e2; color: var(--danger); }
  .btn-danger:hover { background: var(--danger); color: #fff; }
  .btn-sm { padding: 6px 10px; font-size: 12px; }
  .content { padding: 22px; flex: 1; }
  .card { background: var(--card); border-radius: 14px; border: 1px solid var(--border); padding: 20px; margin-bottom: 18px; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
  .card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .card-head h2 { font-size: 16px; font-weight: 700; flex: 1; }
  .card-head .ico { font-size: 20px; }
  .grid { display: grid; gap: 16px; }
  .grid-2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  .grid-4 { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
  .stat { background: var(--card); border-radius: 14px; padding: 18px; border: 1px solid var(--border); display: flex; align-items: center; gap: 14px; transition: transform .2s; }
  .stat:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,.07); }
  .stat-ico { width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; flex-shrink: 0; }
  .stat-ico.green { background: var(--primary-light); }
  .stat-ico.amber { background: var(--accent-light); }
  .stat-ico.blue { background: #dbeafe; }
  .stat-ico.purple { background: #ede9fe; }
  .stat-val { font-size: 22px; font-weight: 800; line-height: 1.1; }
  .stat-lbl { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .form-row { display: grid; gap: 14px; margin-bottom: 14px; }
  .form-row.cols-2 { grid-template-columns: 1fr 1fr; }
  .form-row.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
  .form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: .4px; }
  input[type="text"], input[type="number"], input[type="time"], input[type="date"], input[type="tel"], input[type="password"], input[type="month"], select, textarea {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 9px; font-size: 14px; font-family: inherit; background: #fff; color: var(--text);
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(13,148,136,.12); }
  textarea { resize: vertical; min-height: 70px; }
  .tbl-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid var(--border); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; background: #fff; }
  th { background: #f8fafc; text-align: left; padding: 11px 12px; font-weight: 700; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .3px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 10px 12px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
  tr:hover td { background: #f8fafc; }
  td input, td select { padding: 7px 9px; font-size: 13px; }
  .col-nama { min-width: 200px; }
  .col-nama input { min-width: 180px; }
  .mini-btn { background: none; border: none; cursor: pointer; font-size: 15px; padding: 4px 6px; border-radius: 6px; }
  .mini-btn:hover { background: var(--bg); }
  .tag { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 700; background: var(--primary-light); color: var(--primary-dark); }
  .tag.amber { background: var(--accent-light); color: #92400e; }
  .rem-item { display: flex; align-items: center; gap: 14px; padding: 13px 15px; border-radius: 11px; background: #fff; border: 1px solid var(--border); margin-bottom: 10px; }
  .rem-item.soon { border-color: var(--accent); background: #fffbeb; }
  .rem-ico { width: 42px; height: 42px; border-radius: 11px; display: grid; place-items: center; font-size: 20px; background: var(--primary-light); flex-shrink: 0; }
  .rem-body { flex: 1; min-width: 0; }
  .rem-title { font-weight: 700; font-size: 14px; }
  .rem-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .rem-count { font-size: 12px; font-weight: 800; color: var(--primary-dark); white-space: nowrap; }
  .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; max-width: 360px; }
  .toast { background: #fff; border-left: 4px solid var(--primary); border-radius: 12px; padding: 14px 16px; box-shadow: 0 10px 30px rgba(0,0,0,.15); display: flex; gap: 12px; align-items: flex-start; animation: slideIn .35s ease; }
  .toast.warn { border-left-color: var(--accent); }
  .toast.danger { border-left-color: var(--danger); }
  .toast.cloud { border-left-color: #3b82f6; }
  .toast .t-ico { font-size: 22px; }
  .toast .t-title { font-weight: 700; font-size: 13px; }
  .toast .t-msg { font-size: 12px; color: var(--muted); margin-top: 2px; }
  @keyframes slideIn { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  .progress { height: 8px; background: #e2e8f0; border-radius: 5px; overflow: hidden; margin-top: 6px; }
  .progress > div { height: 100%; border-radius: 5px; background: linear-gradient(90deg, var(--primary), var(--accent)); }
  .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,.55); display: none; align-items: center; justify-content: center; z-index: 9998; padding: 20px; }
  .modal-overlay.show { display: flex; }
  .modal { background: #fff; border-radius: 16px; max-width: 620px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 24px; }
  .modal h3 { font-size: 17px; margin-bottom: 16px; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
  .empty { text-align: center; padding: 40px 20px; color: var(--muted); }
  .empty .e-ico { font-size: 46px; margin-bottom: 10px; opacity: .55; }
  .section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  .section-head h2 { font-size: 20px; font-weight: 800; }
  .section-head .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .mut-table td input { width: 100%; text-align: center; padding: 4px; font-size: 12px; }
  .mut-table th { text-align: center; font-size: 11px; padding: 8px 4px; }
  .mut-table td:first-child { text-align: left; font-weight: 600; }
  .mut-table th:first-child, .mut-table td:first-child { position: sticky; left: 0; background: #fff; z-index: 2; min-width: 200px; }
  .mut-table th:first-child { background: #f8fafc; }
  .report-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
  .report-card { background: #fff; border-radius: 14px; border: 1px solid var(--border); padding: 22px; cursor: pointer; transition: all .25s; text-align: center; }
  .report-card:hover { transform: translateY(-4px); box-shadow: 0 12px 28px rgba(0,0,0,.1); border-color: var(--primary); }
  .report-card .r-ico { font-size: 38px; margin-bottom: 12px; display: block; }
  .report-card .r-title { font-weight: 800; font-size: 15px; margin-bottom: 6px; }
  .report-card .r-desc { font-size: 12px; color: var(--muted); line-height: 1.5; }
  .info-box { background: #eff6ff; border-left: 4px solid #3b82f6; padding: 14px; border-radius: 8px; font-size: 13px; line-height: 1.6; margin-bottom: 14px; }
  .info-box.warn { background: #fffbeb; border-color: var(--accent); }
  .info-box.success { background: #f0fdf4; border-color: var(--success); }
  .info-box.danger { background: #fef2f2; border-color: var(--danger); }
  .info-box code { background: rgba(0,0,0,.06); padding: 2px 6px; border-radius: 4px; font-size: 11px; word-break: break-all; }
  .abs-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
  .abs-tab { padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); background: transparent; border: none; }
  .abs-tab:hover { background: var(--bg); color: var(--text); }
  .abs-tab.active { background: var(--primary); color: #fff; }
  .abs-person-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 8px; flex-wrap: wrap; background: #fff; }
  .abs-person-name { flex: 1; min-width: 130px; font-weight: 600; font-size: 14px; }
  .abs-person-status { display: flex; gap: 5px; flex-wrap: wrap; }
  .abs-status-btn { padding: 6px 10px; border: 1px solid var(--border); background: #fff; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; transition: all .15s; display: inline-flex; align-items: center; gap: 4px; color: var(--text); }
  .abs-status-btn:hover { transform: translateY(-1px); }
  .abs-status-btn.active { color: #fff; border-color: transparent; }
  .abs-status-btn.active[data-status="Hadir"] { background: #10b981; }
  .abs-status-btn.active[data-status="Tidak hadir"] { background: #ef4444; }
  .abs-status-btn.active[data-status="Izin"] { background: #f59e0b; }
  .abs-status-btn.active[data-status="Sakit"] { background: #fb923c; }
  .abs-status-btn.active[data-status="Dinas"] { background: #3b82f6; }
  .abs-person-reason { width: 100%; margin-top: 6px; display: none; }
  .abs-person-reason.show { display: block; }
  .abs-chip { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 700; }
  .abs-chip.Hadir { background: #d1fae5; color: #065f46; }
  .abs-chip.Izin { background: #fef3c7; color: #92400e; }
  .abs-chip.Sakit { background: #ffedd5; color: #9a3412; }
  .abs-chip.Dinas { background: #dbeafe; color: #1e40af; }
  .heat-table td, .heat-table th { padding: 6px; font-size: 11px; text-align: center; }
  .heat-cell { display: inline-block; width: 24px; height: 24px; border-radius: 5px; line-height: 24px; color: #fff; font-size: 12px; font-weight: 700; }
  /* Laporan UPA: kolom absensi lebih lebar */
  #upa_absensi { min-width: 640px; }
  #upa_absensi td:nth-child(1), #upa_absensi th:nth-child(1) { min-width: 160px; }
  #upa_absensi td:nth-child(2), #upa_absensi th:nth-child(2) { min-width: 160px; }
  #upa_absensi td:nth-child(3), #upa_absensi th:nth-child(3) { min-width: 180px; }
  .upa-status-pill {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 700;
    cursor: pointer; border: 1px solid var(--border); background: #fff;
    color: var(--muted); transition: all .15s; white-space: nowrap; font-family: inherit;
  }
  .upa-status-pill:hover { transform: translateY(-1px); }
  .upa-status-pill.active[data-val="Hadir"] { background: #10b981; color: #fff; border-color: #10b981; }
  .upa-status-pill.active[data-val="Tidak hadir"] { background: #ef4444; color: #fff; border-color: #ef4444; }
  .lvl-chip { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }
  .lvl-Muhib { background: #fce7f3; color: #9d174d; }
  .lvl-Muayyid { background: #e0e7ff; color: #3730a3; }
  .lvl-Muntashib { background: #dbeafe; color: #1e40af; }
  .lvl-Muntandhim { background: #d1fae5; color: #065f46; }
  .lvl-Tamhidi { background: #fef3c7; color: #92400e; }
  .sts-chip { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }
  .sts-Aktif { background: #d1fae5; color: #065f46; }
  .sts-Lulus { background: #dbeafe; color: #1e40af; }
  .sts-Keluar { background: #fee2e2; color: #991b1b; }
  .sts-Mubarak { background: #f3e8ff; color: #6b21a8; }
  .sts-Hijrah { background: #fef3c7; color: #92400e; }
  .pohon-kader { border: 1px solid var(--border); border-radius: 12px; margin-bottom: 12px; background: #fff; overflow: hidden; }
  .pohon-kader-head { padding: 14px 16px; background: #f8fafc; display: flex; align-items: center; gap: 12px; cursor: pointer; user-select: none; flex-wrap: wrap; }
  .pohon-kader-head:hover { background: var(--primary-light); }
  .pohon-kader-head .pohon-avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; font-weight: 800; display: grid; place-items: center; font-size: 14px; }
  .pohon-kader-head .pohon-info { flex: 1; min-width: 140px; }
  .pohon-kader-head .pohon-nama { font-weight: 700; font-size: 14px; }
  .pohon-kader-head .pohon-sub { font-size: 11px; color: var(--muted); }
  .pohon-kader-head .pohon-count { font-size: 12px; font-weight: 700; color: var(--primary-dark); }
  .pohon-kader-body { padding: 12px 16px; display: none; }
  .pohon-kader.open .pohon-kader-body { display: block; }
  .binaan-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; background: #fff; flex-wrap: wrap; }
  .binaan-nama { flex: 1; min-width: 130px; font-weight: 600; font-size: 13px; }
  .binaan-meta { font-size: 11px; color: var(--muted); }
  .kegiatan-grup { padding: 8px 0; }
  .kegiatan-grup ul { margin: 4px 0 0 20px; padding: 0; }
  .kegiatan-grup li { font-size: 12px; margin-bottom: 2px; }
  @media print {
    body * { visibility: hidden; }
    #printArea, #printArea * { visibility: visible; }
    #printArea { position: absolute; left: 0; top: 0; width: 100%; background: #fff; padding: 20px; }
  }
  #printArea { display: none; }
  @media (max-width: 900px) {
    .sidebar { transform: translateX(-100%); }
    .sidebar.open { transform: translateX(0); }
    .main { margin-left: 0; }
    .menu-btn { display: block; }
    .form-row.cols-2, .form-row.cols-3 { grid-template-columns: 1fr; }
    .content { padding: 14px; }
    .topbar h1 { font-size: 15px; }
    .btn .btn-text { display: none; }
  }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">🕌</div>
      <div>
        <div class="brand-title">UPA</div>
        <div class="brand-sub">UPA</div>
      </div>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-footer" id="appVersion">v3.7 — Auto Statistik</div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn">☰</button>
      <h1 id="pageTitle">Dashboard</h1>
      <div class="topbar-actions">
        <div class="cloud-pill offline" id="cloudPill" title="Klik untuk sync">
          <span class="dot"></span><span id="cloudText">Offline</span>
        </div>
        <button class="icon-btn" id="bellBtn">🔔<span class="badge hidden" id="bellBadge">0</span></button>
        <button class="btn btn-wa" id="waReportBtn"><span>📱</span></button>
      </div>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>

<div class="toast-container" id="toasts"></div>
<div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalBox"></div></div>
<div id="printArea"></div>

<script>
/* ============ KONSTANTA ============ */
const LS_KEY = 'raker_upa_jsonbin_v1';
const DAYS = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const APP_VERSION = '3.10';
const MUSTAWA_LEVELS = ['Muntandhim','Muntashib','Muayyid','Tamhidi','Muhib'];
const BINAAN_LEVELS = ['Muhib','Muayyid','Muntashib','Muntandhim','Tamhidi'];
const BINAAN_STATUS = ['Aktif','Lulus','Keluar','Mubarak','Hijrah'];
const ABSENSI_STATUS = ['Hadir', 'Tidak hadir', 'Izin', 'Sakit', 'Dinas'];
const ABSENSI_EMOJI = { 'Hadir': '✅', 'Tidak hadir': '❌', 'Izin': '🟡', 'Sakit': '🟠', 'Dinas': '🔵' };
const ABSENSI_COLOR = { 'Hadir': '#10b981', 'Tidak hadir': '#ef4444', 'Izin': '#f59e0b', 'Sakit': '#fb923c', 'Dinas': '#3b82f6' };
function uid() { return Math.random().toString(36).slice(2, 10); }
function formatRupiah(val) {
  let num;
  if (typeof val === 'number' && isFinite(val)) num = Math.floor(val);
  else { const digits = String(val ?? '').replace(/[^0-9]/g, ''); num = Number(digits) || 0; }

function loadState() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return JSON.parse(JSON.stringify(DEFAULT_STATE));
    return deepMerge(JSON.parse(JSON.stringify(DEFAULT_STATE)), JSON.parse(raw));
  } catch(e) { return JSON.parse(JSON.stringify(DEFAULT_STATE)); }
}
function deepMerge(base, over) {
  for (const k in over) {
    if (over[k] && typeof over[k] === 'object' && !Array.isArray(over[k])) {
      base[k] = deepMerge(base[k] || {}, over[k]);
    } else { base[k] = over[k]; }
  }
  return base;
}

const JSONBIN_BASE = 'https://api.jsonbin.io/v3/b';
function setCloudStatus(s) {
  state.cloud.status = s;
  const pill = document.getElementById('cloudPill');
  const text = document.getElementById('cloudText');
  if (!pill || !text) return;
  pill.className = 'cloud-pill ' + s;
  text.textContent = { offline:'Offline', syncing:'Syncing...', online:'Online', error:'Error' }[s] || s;
}
function cloudHeaders() { return { 'Content-Type': 'application/json', 'X-Master-Key': state.cloud.masterKey, 'X-Bin-Meta': 'false' }; }
async function testCloud() {
  const bin = (document.getElementById('cloud_bin') || {}).value.trim();
  const key = (document.getElementById('cloud_key') || {}).value.trim();
  if (!bin || !key) { toast('Kosong', 'Isi Bin ID & Master Key dulu.', 'warn'); return; }
  setCloudStatus('syncing');
  try {
    const res = await fetch(`${JSONBIN_BASE}/${bin}/latest`, { headers: { 'X-Master-Key': key, 'X-Bin-Meta': 'false' } });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    await res.json();
    setCloudStatus('online');
    toast('Berhasil', 'Koneksi ke JSONBin OK! ✅', 'cloud');
  } catch(e) { setCloudStatus('error'); toast('Gagal', 'Cek Bin ID / Master Key. Error: ' + e.message, 'danger'); }
}
window.testCloud = testCloud;
async function syncFromCloud(silent) {
  if (!state.cloud.binId || !state.cloud.masterKey) { if (!silent) toast('Belum Diatur', 'Isi Bin ID & Master Key di Pengaturan.', 'warn'); return false; }
  setCloudStatus('syncing');
  try {
    const res = await fetch(`${JSONBIN_BASE}/${state.cloud.binId}/latest`, { headers: { 'X-Master-Key': state.cloud.masterKey, 'X-Bin-Meta': 'false' } });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const record = await res.json();
    const payload = record && record.data ? record.data : record;
    if (!payload || !payload.appData) { setCloudStatus('online'); if (!silent) toast('Cloud Kosong', 'Belum ada data tersimpan.', 'warn'); return false; }
    applyCloudData(payload.appData);
    state.cloud.lastSync = new Date().toISOString();
    localStorage.setItem(LS_KEY, JSON.stringify(state));
    setCloudStatus('online');
    if (!silent) toast('Berhasil', 'Data ditarik dari cloud.', 'cloud');
    renderPage();
    return true;
  } catch(e) { setCloudStatus('error'); if (!silent) toast('Gagal Tarik', e.message, 'danger'); return false; }
}
async function syncToCloud(silent) {
  if (!state.cloud.binId || !state.cloud.masterKey) { if (!silent) toast('Belum Diatur', 'Isi Bin ID & Master Key di Pengaturan.', 'warn'); return false; }
  setCloudStatus('syncing');
  const payload = { app: 'raker-upa', version: 3, updatedAt: new Date().toISOString(), appData: state };
  try {
    const res = await fetch(`${JSONBIN_BASE}/${state.cloud.binId}`, { method: 'PUT', headers: cloudHeaders(), body: JSON.stringify(payload) });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    state.cloud.lastSync = new Date().toISOString();
    localStorage.setItem(LS_KEY, JSON.stringify(state));
    setCloudStatus('online');
    if (!silent) toast('Berhasil', 'Data terkirim ke cloud. ☁️', 'cloud');
    return true;
  } catch(e) { setCloudStatus('error'); if (!silent) toast('Gagal Kirim', e.message, 'danger'); return false; }
}
function applyCloudData(data) {
  if (!data || typeof data !== 'object') return;
  if (data.identitas) Object.assign(state.identitas, data.identitas);
  if (data.wa) Object.assign(state.wa, data.wa);
  if (data.cloud) {
    const myBin = state.cloud.binId;
    const myKey = state.cloud.masterKey;
    Object.assign(state.cloud, data.cloud);
    state.cloud.binId = myBin;
    state.cloud.masterKey = myKey;
  }
  if (Array.isArray(data.anggota))    state.anggota = data.anggota;
  if (Array.isArray(data.progja))     state.progja = data.progja;
  if (Array.isArray(data.materi))     state.materi = data.materi;
  if (Array.isArray(data.kader)) {
    state.kader = data.kader.map(k => ({ ...k, binaan: Array.isArray(k.binaan) ? k.binaan : [] }));
  }
  if (Array.isArray(data.laporanUPA)) state.laporanUPA = data.laporanUPA;
  if (Array.isArray(data.absensi))    state.absensi = data.absensi;
  if (data.absensiReminder) state.absensiReminder = deepMerge(state.absensiReminder || {}, data.absensiReminder);
  if (data.statistik) {
    if (Array.isArray(data.statistik.usroh))  state.statistik.usroh = data.statistik.usroh;
    if (Array.isArray(data.statistik.target)) state.statistik.target = data.statistik.target;
  }
  if (data.mutabaah) state.mutabaah = deepMerge(state.mutabaah, data.mutabaah);
  if (data.settings) Object.assign(state.settings, data.settings);
}

function formatDateID(d) {
  const bln = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  return `${d.getDate()} ${bln[d.getMonth()]} ${d.getFullYear()}`;
}
function formatDateShort(s) {
  if (!s) return '-';
  const parts = String(s).split('-');
  if (parts.length === 3) {
    const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
    return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
  }
  return s;
}
function hitungUmur(tglGabung) {
  if (!tglGabung) return '-';
  const parts = String(tglGabung).split('-');
  if (parts.length !== 3) return '-';
  const gabung = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
  const now = new Date();
  const hari = Math.floor((now - gabung) / (1000 * 60 * 60 * 24));
  if (hari < 30) return `${hari} hari`;
  if (hari < 365) return `${Math.floor(hari / 30)} bulan`;
  const th = Math.floor(hari / 365);
  const sisa = Math.floor((hari % 365) / 30);
  return sisa > 0 ? `${th} thn ${sisa} bln` : `${th} tahun`;
}
function initialOf(nama) {
  return (String(nama || '?').trim().split(/\s+/).map(w => w[0]).join('').slice(0,2) || '?').toUpperCase();
}

/* ============ HITUNG STATISTIK IDENTITAS OTOMATIS ============ */
function hitungStatistikIdentitas() {
  const kader = state.kader || [];
  const allBinaan = [];
  kader.forEach(k => (k.binaan || []).forEach(b => allBinaan.push({ ...b, naqib: b.naqib || k.naqib || '' })));
  const cJenjang = j => kader.filter(k => k.jenjang === j).length;
  const cLevel = lvl => allBinaan.filter(b => b.level === lvl).length;

  // Kelompok dihitung dari Naqib yang berbeda pada setiap jenjang.
  // Jika beberapa baris Data Kader memiliki Naqib dan jenjang yang sama,
  // itu tetap satu kelompok. Naqib yang sama pada jenjang berbeda dihitung
  // sebagai kelompok terpisah untuk masing-masing jenjang.
  const cKelompok = lvl => {
    const naqibUnik = new Set();
    kader.forEach(k => {
      if (k.jenjang === lvl && String(k.naqib || '').trim()) {
        naqibUnik.add(String(k.naqib).trim().toLocaleLowerCase('id-ID'));
      }
    });
    return naqibUnik.size;
  };

  return {
    kMuntashib: cKelompok('Muntashib'),
    kMuayyid: cKelompok('Muayyid'),
    kTamhidi: cKelompok('Tamhidi'),
    kMuhib: cKelompok('Muhib'),
    allIkhwan: kader.length + allBinaan.length,
    muntandhim: cJenjang('Muntandhim') + cLevel('Muntandhim'),
    muntashib: cJenjang('Muntashib') + cLevel('Muntashib'),
    muayyid: cJenjang('Muayyid') + cLevel('Muayyid'),
    tamhidi: cJenjang('Tamhidi') + cLevel('Tamhidi'),
    muhib: cJenjang('Muhib') + cLevel('Muhib')
  };
}

      <div class="form-group" style="margin-bottom:14px"><label>Catatan</label><textarea id="binaan_catatan" rows="2" placeholder="Catatan perkembangan binaan..."></textarea></div>
      <div class="modal-actions">
        <button class="btn btn-outline" id="binaanCancel">Batal</button>
        <button class="btn btn-primary" id="binaanSave">💾 Simpan</button>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">Tutup</button>
    </div>
  `);
  let editingId = null;
  function renderList() {
    const listEl = document.getElementById('binaanListModal');
    if (!kader.binaan.length) {
      listEl.innerHTML = `<div class="empty" style="padding:20px"><div class="e-ico">🌱</div><p style="font-size:13px">Belum ada binaan. Klik tombol di bawah untuk menambah.</p></div>`;
      return;
    }
    listEl.innerHTML = kader.binaan.map(b => `
      <div class="binaan-item">
        <div style="flex:1; min-width:150px">
          <div class="binaan-nama">${esc(b.nama)||'(tanpa nama)'}</div>
          <div class="binaan-meta">
            <span class="lvl-chip lvl-${esc(b.level)}">${esc(b.level)}</span>
            <span class="sts-chip sts-${esc(b.status)}" style="margin-left:4px">${esc(b.status)}</span>
            ${b.tanggalGabung ? ` • Gabung ${formatDateShort(b.tanggalGabung)} (${hitungUmur(b.tanggalGabung)})` : ''}
          </div>
        </div>
        <button class="mini-btn" onclick="editBinaanModal('${kaderId}','${b.id}')" title="Edit">✏️</button>
        <button class="mini-btn" onclick="hapusBinaanModal('${kaderId}','${b.id}')" title="Hapus">🗑️</button>
      </div>
    `).join('');
  }
  renderList();
  function resetForm() {
    document.getElementById('binaan_nama').value = '';
    document.getElementById('binaan_level').value = 'Muhib';
    document.getElementById('binaan_tgl').value = new Date().toISOString().slice(0,10);
    document.getElementById('binaan_status').value = 'Aktif';
    document.getElementById('binaan_hp').value = '';
    document.getElementById('binaan_usia').value = '';
    document.getElementById('binaan_alamat').value = '';
    document.getElementById('binaan_pekerjaan').value = '';
    document.getElementById('binaan_catatan').value = '';
    editingId = null;
    document.getElementById('binaanFormTitle').textContent = 'Tambah Binaan Baru';
  }
  document.getElementById('btnTambahBinaan').onclick = () => {
    resetForm();
    document.getElementById('binaanFormModal').style.display = 'block';
    document.getElementById('binaan_nama').focus();
  };
  document.getElementById('binaanCancel').onclick = () => {
    document.getElementById('binaanFormModal').style.display = 'none';
    resetForm();
  };
  document.getElementById('binaanSave').onclick = () => {
    const nama = document.getElementById('binaan_nama').value.trim();
    if (!nama) { alert('Nama binaan wajib diisi.'); return; }
    const data = {
      nama,
      level: document.getElementById('binaan_level').value,
      tanggalGabung: document.getElementById('binaan_tgl').value,
      status: document.getElementById('binaan_status').value,
      hp: document.getElementById('binaan_hp').value.trim(),
      usia: document.getElementById('binaan_usia').value.trim(),
      alamat: document.getElementById('binaan_alamat').value.trim(),
      pekerjaan: document.getElementById('binaan_pekerjaan').value.trim(),
      catatan: document.getElementById('binaan_catatan').value.trim()
    };
    if (editingId) {
      const idx = kader.binaan.findIndex(b => b.id === editingId);
      if (idx >= 0) kader.binaan[idx] = { ...kader.binaan[idx], ...data };
      toast('Tersimpan', 'Binaan diperbarui.');
    } else {
      kader.binaan.push({ id: uid(), ...data });
      toast('Tersimpan', 'Binaan ditambahkan.');
    }
    saveState();
    document.getElementById('binaanFormModal').style.display = 'none';
    resetForm();
    renderList();
    renderKader(document.getElementById('content'));
  };
  window.editBinaanModal = function(kid, bid) {
    const k = state.kader.find(x => x.id === kid);
    if (!k) return;
    const b = k.binaan.find(x => x.id === bid);
    if (!b) return;
    editingId = bid;
    document.getElementById('binaan_nama').value = b.nama || '';
    document.getElementById('binaan_level').value = b.level || 'Muhib';
    document.getElementById('binaan_tgl').value = b.tanggalGabung || '';
    document.getElementById('binaan_status').value = b.status || 'Aktif';
    document.getElementById('binaan_hp').value = b.hp || '';
    document.getElementById('binaan_usia').value = b.usia || '';
    document.getElementById('binaan_alamat').value = b.alamat || '';
    document.getElementById('binaan_pekerjaan').value = b.pekerjaan || '';
    document.getElementById('binaan_catatan').value = b.catatan || '';
    document.getElementById('binaanFormTitle').textContent = '✏️ Edit Binaan';
    document.getElementById('binaanFormModal').style.display = 'block';
    document.getElementById('binaan_nama').focus();
  };
  window.hapusBinaanModal = function(kid, bid) {
    if (!confirm('Hapus binaan ini?')) return;
    const k = state.kader.find(x => x.id === kid);
    if (!k) return;
    k.binaan = k.binaan.filter(x => x.id !== bid);
    saveState();
    renderList();
    renderKader(document.getElementById('content'));
  };
};

/* ============ BINAAN (HALAMAN) ============ */
function renderBinaan(c) {
  const totalBinaan = state.kader.reduce((s, k) => s + (k.binaan || []).length, 0);
  const tabs = [
    { id: 'daftar', ico: '📋', label: 'Daftar Binaan' },
    { id: 'pohon', ico: '🌳', label: 'Pohon Binaan' },
    { id: 'statistik', ico: '📊', label: 'Statistik' },
    { id: 'timeline', ico: '📅', label: 'Timeline' }
  ];
  c.innerHTML = `
    <div class="section-head">
      <div><h2>Binaan</h2><div class="sub">${totalBinaan} binaan dari ${state.kader.length} kader</div></div>
      <div style="display:flex; gap:8px; flex-wrap:wrap">
        <button class="btn btn-outline" id="binaanExcel">📊 Excel</button>
        <button class="btn btn-wa" id="binaanWA">📱 Kirim WA</button>
        <button class="btn btn-outline" id="binaanPrint">🖨️ Cetak</button>
      </div>
    </div>
    <div class="abs-tabs">
      ${tabs.map(t => `<button class="abs-tab ${binaanTab === t.id ? 'active' : ''}" data-btab="${t.id}">${t.ico} ${t.label}</button>`).join('')}
    </div>
    <div id="binaanContent"></div>
  `;
  c.querySelectorAll('[data-btab]').forEach(btn => {
    btn.onclick = () => { binaanTab = btn.dataset.btab; renderBinaan(c); };
  });
  const box = document.getElementById('binaanContent');
  ({ daftar: renderBinaanDaftar, pohon: renderBinaanPohon, statistik: renderBinaanStatistik, timeline: renderBinaanTimeline }[binaanTab] || renderBinaanDaftar)(box);
  document.getElementById('binaanExcel').onclick = exportBinaanExcel;
  document.getElementById('binaanWA').onclick = sendWABinaan;
  document.getElementById('binaanPrint').onclick = printBinaan;
}

function renderBinaanDaftar(c) {
  const filterKader = c._bk || '';
  const filterLevel = c._bl || '';
  const filterStatus = c._bs || '';
  const filterBulan = c._bb || '';
  const rows = [];
  state.kader.forEach(k => {
    (k.binaan || []).forEach(b => {
      if (filterKader && k.id !== filterKader) return;
      if (filterLevel && b.level !== filterLevel) return;
      if (filterStatus && b.status !== filterStatus) return;
      if (filterBulan && !(b.tanggalGabung || '').startsWith(filterBulan)) return;
      rows.push({ kader: k, binaan: b });
    });
  });
  rows.sort((a, b) => (b.binaan.tanggalGabung || '').localeCompare(a.binaan.tanggalGabung || ''));
  c.innerHTML = `
    <div class="card">
      <div class="card-head"><span class="ico">📋</span><h2>Daftar Binaan</h2><div style="margin-left:auto; font-size:13px; color:var(--muted)">${rows.length} baris</div></div>
      <div class="form-row cols-2" style="grid-template-columns:1fr 1fr; gap:10px">
        <div class="form-group"><label>Pembina</label>
          <select id="bk"><option value="">— Semua Kader —</option>
            ${state.kader.map(k => `<option value="${k.id}" ${filterKader===k.id?'selected':''}>${esc(k.nama)||'(tanpa nama)'}</option>`).join('')}
          </select></div>
        <div class="form-group"><label>Level</label>
          <select id="bl"><option value="">— Semua Level —</option>
            ${BINAAN_LEVELS.map(l => `<option ${filterLevel===l?'selected':''}>${l}</option>`).join('')}
          </select></div>
      </div>
      <div class="form-row cols-2" style="grid-template-columns:1fr 1fr; gap:10px">
        <div class="form-group"><label>Status</label>
          <select id="bs"><option value="">— Semua Status —</option>
            ${BINAAN_STATUS.map(s => `<option ${filterStatus===s?'selected':''}>${s}</option>`).join('')}
          </select></div>
        <div class="form-group"><label>Bulan Gabung</label><input type="month" id="bb" value="${filterBulan}"></div>
      </div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>No</th><th>Nama</th><th>Level</th><th>Pembina</th><th>Gabung</th><th>Status</th><th>HP</th><th>Aksi</th></tr></thead>
        <tbody>
          ${rows.length ? rows.map((r, i) => `<tr>
            <td>${i+1}</td>
            <td><b>${esc(r.binaan.nama)}</b></td>
            <td><span class="lvl-chip lvl-${esc(r.binaan.level)}">${esc(r.binaan.level)}</span></td>
            <td>${esc(r.kader.nama)||'-'}</td>
            <td>${formatDateShort(r.binaan.tanggalGabung)}<br><span style="font-size:11px;color:var(--muted)">${hitungUmur(r.binaan.tanggalGabung)}</span></td>
            <td><span class="sts-chip sts-${esc(r.binaan.status)}">${esc(r.binaan.status)}</span></td>
            <td>${esc(r.binaan.hp) || '-'}</td>
            <td><button class="mini-btn" onclick="kelolaBinaan('${r.kader.id}')" title="Kelola">✏️</button></td>
          </tr>`).join('') : `<tr><td colspan="8"><div class="empty"><div class="e-ico">🌱</div><p>Belum ada binaan yang cocok filter.</p></div></td></tr>`}
        </tbody>
      </table></div>
    </div>
  `;
  document.getElementById('bk').onchange = e => { c._bk = e.target.value; renderBinaanDaftar(c); };
  document.getElementById('bl').onchange = e => { c._bl = e.target.value; renderBinaanDaftar(c); };
  document.getElementById('bs').onchange = e => { c._bs = e.target.value; renderBinaanDaftar(c); };
  document.getElementById('bb').onchange = e => { c._bb = e.target.value; renderBinaanDaftar(c); };
}

function renderBinaanPohon(c) {

    <div class="card">

        <div style="margin-left:auto; display:flex; gap:6px">

        </div>
      </div>
      ${sorted.length ? sorted.map(k => {

          </div>
          <div class="pohon-kader-body">

              <div class="binaan-item">
                <div style="flex:1; min-width:150px">
                  <div class="binaan-nama">${esc(b.nama)}</div>
                  <div class="binaan-meta">
                    <span class="lvl-chip lvl-${esc(b.level)}">${esc(b.level)}</span>
                    <span class="sts-chip sts-${esc(b.status)}" style="margin-left:4px">${esc(b.status)}</span>

                  </div>

                </div>
                <button class="mini-btn" onclick="kelolaBinaan('${k.id}')" title="Kelola">✏️</button>
              </div>`).join('') : `<div style="padding:10px; color:var(--muted); font-size:13px; text-align:center">Belum ada binaan</div>`}

    </div>
  `;
  c.querySelectorAll('[data-toggle]').forEach(el => {

      renderBinaanPohon(c);

    renderBinaanPohon(c);
  };
  document.getElementById('pohonCollapse').onclick = () => { c._open = {}; renderBinaanPohon(c); };

function renderBinaanStatistik(c) {
  const perLevel = {};
  BINAAN_LEVELS.forEach(l => perLevel[l] = 0);
  const perStatus = {};
  BINAAN_STATUS.forEach(s => perStatus[s] = 0);
  const perKader = [];
  state.kader.forEach(k => {
    const total = (k.binaan || []).length;
    const aktif = (k.binaan || []).filter(b => b.status === 'Aktif').length;
    if (total > 0) perKader.push({ nama: k.nama, total, aktif, id: k.id });
    (k.binaan || []).forEach(b => {
      if (perLevel[b.level] !== undefined) perLevel[b.level]++;
      if (perStatus[b.status] !== undefined) perStatus[b.status]++;
    });
  });
  perKader.sort((a, b) => b.total - a.total);
  const totalBinaan = Object.values(perLevel).reduce((s, v) => s + v, 0);
  c.innerHTML = `
    <div class="grid grid-4" style="margin-bottom:18px">
      <div class="stat"><div class="stat-ico green">🌳</div><div><div class="stat-val">${totalBinaan}</div><div class="stat-lbl">Total Binaan</div></div></div>
      <div class="stat"><div class="stat-ico blue">👤</div><div><div class="stat-val">${perKader.length}</div><div class="stat-lbl">Kader Punya Binaan</div></div></div>
      <div class="stat"><div class="stat-ico amber">✅</div><div><div class="stat-val">${perStatus['Aktif'] || 0}</div><div class="stat-lbl">Binaan Aktif</div></div></div>
      <div class="stat"><div class="stat-ico purple">📊</div><div><div class="stat-val">${perKader.length ? Math.round(totalBinaan / perKader.length * 10) / 10 : 0}</div><div class="stat-lbl">Rata per Kader</div></div></div>
    </div>
    <div class="grid grid-2">
      <div class="card">
        <div class="card-head"><span class="ico">🎯</span><h2>Per Level</h2></div>
        ${BINAAN_LEVELS.map(l => {
          const pct = totalBinaan ? Math.round(perLevel[l] / totalBinaan * 100) : 0;
          return `<div style="margin-bottom:12px">
            <div style="display:flex; justify-content:space-between; font-size:13px; font-weight:600; margin-bottom:4px">
              <span><span class="lvl-chip lvl-${l}">${l}</span></span>
              <span style="color:var(--muted)"><b style="color:var(--text)">${perLevel[l]}</b> orang</span>
            </div>
            <div class="progress"><div style="width:${pct}%"></div></div>
          </div>`;
        }).join('')}
      </div>
      <div class="card">
        <div class="card-head"><span class="ico">📌</span><h2>Per Status</h2></div>
        ${BINAAN_STATUS.map(s => `
          <div style="display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid #f1f5f9">
            <span class="sts-chip sts-${s}" style="min-width:70px; text-align:center">${s}</span>
            <div style="flex:1"></div>
            <b style="font-size:15px">${perStatus[s]}</b>
          </div>
        `).join('')}
      </div>
    </div>
    <div class="card">
      <div class="card-head"><span class="ico">🏆</span><h2>Peringkat Kader Berdasarkan Binaan</h2></div>
      ${perKader.length ? `<div class="tbl-wrap"><table>
        <thead><tr><th>No</th><th>Kader</th><th style="text-align:center">Total Binaan</th><th style="text-align:center">Aktif</th><th>Aksi</th></tr></thead>
        <tbody>${perKader.map((k, i) => `<tr>
          <td>${i+1}</td>
          <td><b>${esc(k.nama) || '(tanpa nama)'}</b></td>
          <td style="text-align:center"><span class="lvl-chip lvl-Muntandhim">${k.total}</span></td>
          <td style="text-align:center">${k.aktif}</td>
          <td><button class="mini-btn" onclick="kelolaBinaan('${k.id}')">✏️</button></td>
        </tr>`).join('')}</tbody>
      </table></div>` : '<div class="empty"><div class="e-ico">🌱</div><p>Belum ada binaan.</p></div>'}
    </div>
  `;
}

function renderBinaanTimeline(c) {
  const filterBulan = c._tlineB || '';
  const events = [];
  state.kader.forEach(k => {
    (k.binaan || []).forEach(b => {
      if (!b.tanggalGabung) return;
      if (filterBulan && !b.tanggalGabung.startsWith(filterBulan)) return;
      events.push({ kader: k, binaan: b });
    });
  });
  events.sort((a, b) => (b.binaan.tanggalGabung || '').localeCompare(a.binaan.tanggalGabung || ''));
  const grouped = {};
  events.forEach(e => {
    const key = (e.binaan.tanggalGabung || '').slice(0, 7);
    if (!grouped[key]) grouped[key] = [];
    grouped[key].push(e);
  });
  const bulanID = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  c.innerHTML = `
    <div class="card">
      <div class="card-head"><span class="ico">📅</span><h2>Timeline Bergabung</h2>
        <input type="month" id="tlineB" value="${filterBulan}" style="margin-left:auto; width:auto; padding:6px 10px; font-size:12px">
      </div>
      ${Object.keys(grouped).length ? Object.entries(grouped).map(([bulan, list]) => {
        const [y, m] = bulan.split('-');
        return `<div style="margin-bottom:22px">
          <div style="font-weight:800; font-size:15px; color:var(--primary-dark); margin-bottom:10px">📅 ${bulanID[Number(m)-1]} ${y}</div>
          ${list.map(e => `
            <div style="display:flex; gap:12px; padding:10px 12px; background:#fff; border:1px solid var(--border); border-left:4px solid var(--primary); border-radius:8px; margin-bottom:8px; align-items:center; flex-wrap:wrap">
              <div style="font-size:18px">🌱</div>
              <div style="flex:1; min-width:150px">
                <div style="font-weight:700; font-size:14px">${esc(e.binaan.nama)}</div>
                <div style="font-size:11px; color:var(--muted)">Bergabung sebagai <span class="lvl-chip lvl-${esc(e.binaan.level)}">${esc(e.binaan.level)}</span></div>
              </div>
              <div style="font-size:12px; color:var(--muted); text-align:right">
                <div>${formatDateShort(e.binaan.tanggalGabung)}</div>
                <div style="font-size:11px">Dibina oleh <b>${esc(e.kader.nama) || '-'}</b></div>
              </div>
            </div>
          `).join('')}
        </div>`;
      }).join('') : `<div class="empty"><div class="e-ico">📅</div><p>Belum ada data timeline.</p></div>`}
    </div>
  `;
  document.getElementById('tlineB').onchange = e => { c._tlineB = e.target.value; renderBinaanTimeline(c); };
}

function exportBinaanExcel() {
  const rows = [['Pembina','Nama Binaan','Level','Status','Tanggal Gabung','Lama Bergabung','HP','Usia','Alamat','Pekerjaan','Catatan']];
  state.kader.forEach(k => {
    (k.binaan || []).forEach(b => {
      rows.push([k.nama || '', b.nama || '', b.level || '', b.status || '', b.tanggalGabung || '', hitungUmur(b.tanggalGabung), b.hp || '', b.usia || '', b.alamat || '', b.pekerjaan || '', b.catatan || '']);
    });
  });
  if (rows.length === 1) { alert('Belum ada data binaan untuk diekspor.'); return; }
  const csv = '\ufeff' + rows.map(row => row.map(v => '"' + String(v ?? '').replace(/"/g, '""') + '"').join(';')).join('\r\n');
  const blob = new Blob([csv], { type: 'application/vnd.ms-excel;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'Binaan_UPA_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  toast('Berhasil', 'File binaan diekspor.');
}
function sendWABinaan() {
  const rows = [];
  state.kader.forEach(k => {
    if ((k.binaan || []).length === 0) return;

/* ============ STATISTIK ============ */
function getKomposisiKader() {
  // Komposisi dihitung langsung dari Data Kader dan Binaan, bukan input manual.
  const counts = new Map();
  const add = (naqib, mustawa) => {
    if (!MUSTAWA_LEVELS.includes(mustawa)) return;
    const namaNaqib = String(naqib || '').trim() || '(Naqib belum diisi)';
    const key = namaNaqib + '||' + mustawa;
    if (!counts.has(key)) counts.set(key, { naqib: namaNaqib, mustawa, jumlah: 0 });
    counts.get(key).jumlah++;
  };
  (state.kader || []).forEach(k => {
    add(k.naqib, k.jenjang);
    (k.binaan || []).forEach(b => add(k.naqib, b.level));
  });
  const order = new Map(MUSTAWA_LEVELS.map((v, i) => [v, i]));
  return [...counts.values()].sort((a, b) => a.naqib.localeCompare(b.naqib, 'id') || order.get(a.mustawa) - order.get(b.mustawa));
}

        <div class="tbl-wrap"><table>

/* ============ ABSENSI ============ */
function hitungRekapAbsensi(filter = {}) {
  const records = state.absensi || [];
  const filtered = records.filter(r => {
    if (filter.bulan && !(r.tanggal || '').startsWith(filter.bulan)) return false;
    if (filter.kegiatanId && r.kegiatanId !== filter.kegiatanId) return false;
    return true;
  });
  const map = {};
  state.anggota.forEach(a => { map[a.id] = { id: a.id, nama: a.nama, Hadir: 0, 'Tidak hadir': 0, Izin: 0, Sakit: 0, Dinas: 0, total: 0 }; });
  filtered.forEach(r => {
    (r.records || []).forEach(rec => {
      if (!map[rec.anggotaId]) return;
      if (map[rec.anggotaId][rec.status] === undefined) map[rec.anggotaId][rec.status] = 0;
      map[rec.anggotaId][rec.status]++;
      map[rec.anggotaId].total++;
    });
  });
  return Object.values(map).map(v => {
    const persen = v.total > 0 ? Math.round((v.Hadir / v.total) * 100) : 0;
    return { ...v, persen };
  });
}
function getAnggotaAbsenBerturut(minBerturut = 3) {
  const records = [...(state.absensi || [])].sort((a, b) => (b.tanggal || '').localeCompare(a.tanggal || ''));
  const hasil = [];
  state.anggota.forEach(a => {
    let count = 0;
    for (const r of records) {
      const rec = (r.records || []).find(x => x.anggotaId === a.id);
      if (!rec) break;
      if (rec.status === 'Tidak hadir') count++;
      else break;
    }
    if (count >= minBerturut) hasil.push({ ...a, count });
  });
  return hasil.sort((a, b) => b.count - a.count);
}
function getKegiatanPerluAbsensi() {
  if (!state.absensiReminder || !state.absensiReminder.enabled) return [];
  const now = new Date();
  const afterMs = (state.absensiReminder.afterMinutes || 60) * 60000;
  const dilacak = state.absensiReminder.kegiatanIds || [];
  const perTanggal = {};
  state.progja.forEach(p => {
    if (!p.hari || !p.jam) return;
    if (dilacak.length > 0 && !dilacak.includes(p.id)) return;
    const td = DAYS.indexOf(p.hari);
    if (td < 0) return;
    const [h, mi] = p.jam.split(':').map(Number);
    if (isNaN(h)) return;
    let diff = (now.getDay() - td + 7) % 7;
    const kejadian = new Date(now);
    kejadian.setHours(h, mi || 0, 0, 0);
    kejadian.setDate(now.getDate() - diff);
    if (kejadian > now) kejadian.setDate(kejadian.getDate() - 7);
    if (now - kejadian < afterMs) return;
    const tglStr = kejadian.toISOString().slice(0, 10);
    const sudahAda = (state.absensi || []).some(r => r.tanggal === tglStr);
    if (sudahAda) return;
    if (!perTanggal[tglStr]) perTanggal[tglStr] = { tanggal: tglStr, items: [] };
    perTanggal[tglStr].items.push({ id: p.id, nama: p.nama, jam: p.jam, ico: p.ico });
  });
  return Object.values(perTanggal).map(g => ({
    id: g.items[0].id,
    tanggal: g.tanggal,
    jam: g.items[0].jam,
    ico: g.items[0].ico,
    items: g.items
  }));
}

function renderAbsensiRekap(c) {
  const bulanIni = new Date().toISOString().slice(0, 7);
  const bulan = c._absBulan || bulanIni;
  const kegFilter = c._absKeg || '';

/* ============ REMINDER ============ */
function getNextOccurrence(hari, jam) {
  if (!hari || !jam) return null;
  const td = DAYS.indexOf(hari);
  if (td < 0) return null;
  const [h, mi] = jam.split(':').map(Number);
  if (isNaN(h)) return null;
  const now = new Date();
  const next = new Date(now);
  next.setHours(h, mi || 0, 0, 0);
  let diff = (td - now.getDay() + 7) % 7;
  if (diff === 0 && next <= now) diff = 7;
  next.setDate(now.getDate() + diff);
  return next;
}
function formatDiff(ms) {
  const min = Math.round(ms / 60000);
  if (min < 60) return `${min} menit`;
  const hr = Math.floor(min / 60);
  if (hr < 24) return `${hr} jam ${min % 60}m`;
  const d = Math.floor(hr / 24);
  return `${d} hari ${hr % 24}j`;
}
function getUpcomingActivities() {
  const now = new Date();
  const list = [];
  state.progja.forEach(p => {
    const next = getNextOccurrence(p.hari, p.jam);
    if (!next) return;
    const diff = next - now;
    list.push({ ...p, next, diff, soon: diff < 3600000, label: formatDiff(diff) });
  });
  list.sort((a, b) => a.diff - b.diff);
  return list;
}

      ${records.length ? `<div class="tbl-wrap"><table><thead><tr><th>Tanggal</th><th>Tempat</th><th>Materi</th><th>Infaq</th><th>Absensi</th><th>Aksi</th></tr></thead>
        <tbody>${records.map((r,i)=>`<tr><td>${esc(r.tanggal)}</td><td>${esc(r.tempat)||'-'}</td><td>${esc(r.materi)||'-'}</td><td>Rp ${formatRupiah(r.infaq)}</td><td>${(r.absensi||[]).filter(a=>a.status==='Hadir').length} hadir / ${(r.absensi||[]).filter(a=>a.status==='Tidak hadir').length} tidak hadir</td><td><button class="mini-btn" data-upa-del="${i}" title="Hapus">🗑️</button></td></tr>`).join('')}</tbody></table></div>` :
        `<div class="empty"><div class="e-ico">📝</div><p>Belum ada laporan UPA.</p></div>`}
    </div>`;
  let saveDraftIfReady = () => {};
  const infaqInput = document.getElementById('upa_infaq');
  const digitsOnly = value => String(value ?? '').replace(/[^0-9]/g, '');
  const formatRupiahInput = value => {
    let digits = digitsOnly(value);
    digits = digits.replace(/^0+(?=\d)/, '');
    if (!digits) return '';
    return digits.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  };
  infaqInput.value = formatRupiahInput(infaqInput.value);
  infaqInput.addEventListener('input', () => {
    const digits = digitsOnly(infaqInput.value);
    const formatted = formatRupiahInput(digits);
    infaqInput.value = formatted;
    try { infaqInput.setSelectionRange(formatted.length, formatted.length); } catch (_) {}
    saveDraftIfReady();
  });
  const absensiBody = document.getElementById('upa_absensi');
  const statusMap = {};
  state.anggota.forEach(a => { statusMap[a.id] = 'Hadir'; });
  absensiBody.innerHTML = state.anggota.map(a => `<tr>
    <td>${esc(a.nama)||'(Nama belum diisi)'}</td>
    <td>
      <div style="display:flex;gap:5px;flex-wrap:wrap">
        <button type="button" class="upa-status-pill active" data-upa-status="${esc(a.id)}" data-val="Hadir">✅ Hadir</button>
        <button type="button" class="upa-status-pill" data-upa-status="${esc(a.id)}" data-val="Tidak hadir">❌ Tidak</button>
      </div>
    </td>
    <td><input type="text" data-upa-reason="${esc(a.id)}" placeholder="Alasan tidak hadir" disabled></td>
  </tr>`).join('');
  absensiBody.querySelectorAll('.upa-status-pill').forEach(btn => {
    btn.onclick = () => {
      const id = btn.dataset.upaStatus;
      const val = btn.dataset.val;
      statusMap[id] = val;
      absensiBody.querySelectorAll(`[data-upa-status="${id}"]`).forEach(b => {
        b.classList.toggle('active', b.dataset.val === val);
      });
      const reason = absensiBody.querySelector(`[data-upa-reason="${id}"]`);
      reason.disabled = val !== 'Tidak hadir';
      if (reason.disabled) reason.value = '';
      saveDraftIfReady();
    };
  });
  const draftKey = 'upaDraft';
  const saveDraft = () => {
    const draft = {
      tanggal: document.getElementById('upa_tanggal').value,
      tempat: document.getElementById('upa_tempat').value,
      materi: document.getElementById('upa_materi').value,
      infaq: document.getElementById('upa_infaq').value,
      absensi: state.anggota.map(a => ({ anggotaId: a.id, status: statusMap[a.id] || 'Hadir', alasan: absensiBody.querySelector(`[data-upa-reason="${a.id}"]`)?.value || '' }))
    };
    try { localStorage.setItem('raker_upa_jsonbin_v1_' + draftKey, JSON.stringify(draft)); } catch (_) {}
  };
  saveDraftIfReady = saveDraft;
  ['upa_tanggal','upa_tempat','upa_materi','upa_infaq'].forEach(id => { const el = document.getElementById(id); el.addEventListener('input', saveDraft); el.addEventListener('change', saveDraft); });
  absensiBody.querySelectorAll('input').forEach(el => { el.addEventListener('input', saveDraft); el.addEventListener('change', saveDraft); });
  try {
    const draft = JSON.parse(localStorage.getItem('raker_upa_jsonbin_v1_' + draftKey) || 'null');
    if (draft) {
      if (draft.tanggal) document.getElementById('upa_tanggal').value = draft.tanggal;
      if (draft.tempat) document.getElementById('upa_tempat').value = draft.tempat;
      if (draft.materi) document.getElementById('upa_materi').value = draft.materi;
      if (draft.infaq !== undefined) document.getElementById('upa_infaq').value = formatRupiahInput(draft.infaq);
      (draft.absensi || []).forEach(a => {
        statusMap[a.anggotaId] = a.status || 'Hadir';
        absensiBody.querySelectorAll(`[data-upa-status="${a.anggotaId}"]`).forEach(b => {
          b.classList.toggle('active', b.dataset.val === statusMap[a.anggotaId]);
        });
        const reason = absensiBody.querySelector(`[data-upa-reason="${a.anggotaId}"]`);
        if (reason) { reason.value = a.alasan || ''; reason.disabled = statusMap[a.anggotaId] !== 'Tidak hadir'; }
      });
    }
  } catch (_) {}
  document.getElementById('saveUPA').onclick = () => {
    const tanggal = document.getElementById('upa_tanggal').value;
    if (!tanggal) { alert('Tanggal wajib diisi.'); return; }
    const absensi = state.anggota.map(a => ({
      anggotaId: a.id, nama: a.nama,
      status: statusMap[a.id] || 'Hadir',
      alasan: absensiBody.querySelector(`[data-upa-reason="${a.id}"]`).value.trim()
    }));
    records.unshift({ id: uid(), tanggal, tempat: document.getElementById('upa_tempat').value.trim(), materi: document.getElementById('upa_materi').value.trim(), infaq: Math.max(0, Number(digitsOnly(document.getElementById('upa_infaq').value)) || 0), absensi });
    saveState(); try { localStorage.removeItem('raker_upa_jsonbin_v1_upaDraft'); } catch (_) {} toast('Tersimpan', 'Laporan UPA berhasil disimpan.'); renderLaporanUPA(c);
  };
  c.querySelectorAll('[data-upa-del]').forEach(btn => btn.onclick = () => { if (!confirm('Hapus laporan ini?')) return; records.splice(Number(btn.dataset.upaDel), 1); saveState(); renderLaporanUPA(c); });
  document.getElementById('exportUPAExcel').onclick = () => {
    if (!records.length) { alert('Belum ada laporan UPA untuk diekspor.'); return; }
    const rows = [['Tanggal','Tempat','Materi','Infaq (Rp)','Nama Anggota','Absensi','Alasan Tidak Hadir']];
    records.forEach(r => { if (r.absensi && r.absensi.length) r.absensi.forEach(a => rows.push([r.tanggal, r.tempat || '', r.materi || '', Number(r.infaq || 0), a.nama || '', a.status || '', a.alasan || ''])); else rows.push([r.tanggal, r.tempat || '', r.materi || '', Number(r.infaq || 0), '', '', '']); });
    const csv = '\ufeff' + rows.map(row => row.map(v => '"' + String(v ?? '').replace(/"/g, '""') + '"').join(';')).join('\r\n');
    const blob = new Blob([csv], { type: 'application/vnd.ms-excel;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'Laporan_UPA_' + new Date().toISOString().slice(0,10) + '.csv';
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href);
    toast('Berhasil', 'File laporan UPA berhasil diekspor.');
  };
  document.getElementById('sendUPAWA').onclick = () => {
    if (!records.length) { alert('Belum ada laporan UPA untuk dikirim.'); return; }
    const text = records.map(r => {
      const hadir = (r.absensi || []).filter(a => a.status === 'Hadir');
      const tidak = (r.absensi || []).filter(a => a.status === 'Tidak hadir');
      const daftarAbsensi = (r.absensi || []).map((a, i) => `${i + 1}. ${a.nama || '-'}: ${a.status === 'Hadir' ? '✅️' : '❌️'}${a.status === 'Tidak hadir' && a.alasan ? ' (Alasan: ' + a.alasan + ')' : ''}`).join('\n');
      const parts = String(r.tanggal || '').split('-');
      const tanggalID = parts.length === 3 ? new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2])).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }) : (r.tanggal || '-');
      const nilaiInfaq = formatRupiah(r.infaq);
      return `Laporan UPA :
Tanggal : ${tanggalID}
Tempat : ${r.tempat || '-'}
Infaq : Rp ${nilaiInfaq}
Materi : ${r.materi || '-'}

Absensi :

${daftarAbsensi || '-'}

Rekap : ${hadir.length} hadir, ${tidak.length} tidak hadir`;
    }).join('\n\n');
    window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
  };
  document.getElementById('printUPA').onclick = () => {
    const rows = records.map(r => `<section style="margin-bottom:22px"><h3>${esc(r.tanggal)} — ${esc(r.tempat)||'-'}</h3><p><b>Materi:</b> ${esc(r.materi)||'-'}</p><p><b>Infaq:</b> Rp ${formatRupiah(r.infaq)}</p><table style="width:100%;border-collapse:collapse" border="1" cellpadding="6"><tr><th>Nama</th><th>Status</th><th>Alasan</th></tr>${(r.absensi||[]).map(a=>`<tr><td>${esc(a.nama)}</td><td>${esc(a.status)}</td><td>${esc(a.alasan)||'-'}</td></tr>`).join('')}</table></section>`).join('');
    const area = document.getElementById('printArea');
    area.innerHTML = `<h2>Laporan UPA — ${esc(state.identitas.nama)}</h2>${rows || '<p>Belum ada laporan.</p>'}`;
    area.style.display = 'block'; window.print(); area.style.display = 'none';
  };
}

/* ============ WHATSAPP ============ */
function openWA(text) {
  const num = state.wa.defaultNumber || '';
  const url = num ? `https://wa.me/${num}?text=${encodeURIComponent(text)}` : `https://wa.me/?text=${encodeURIComponent(text)}`;
  window.open(url, '_blank');
}
function sendWAStruktur() {
  let msg = `*📋 STRUKTUR ANGGOTA*\n*UPA ${state.identitas.nama}*\n━━━━━━━━━━━━━━━━━━━━\n\n`;
  state.anggota.forEach((a,i) => { msg += `${i+1}. *${a.nama||'(belum diisi)'}*\n   Amanah: ${a.amanah}\n`; if (a.idSik) msg += `   ID SIK: ${a.idSik}\n`; if (a.hp) msg += `   HP: ${a.hp}\n`; msg += `\n`; });
  msg += `━━━━━━━━━━━━━━━━━━━━\nTotal: ${state.anggota.length} anggota\n${formatDateID(new Date())}`;
  openWA(msg);
}
function sendWAKader() {
  if (!state.kader.length) { toast('Kosong', 'Belum ada data kader.', 'warn'); return; }
  let msg = `*👥 DATA KADER*\n*UPA ${state.identitas.nama}*\n━━━━━━━━━━━━━━━━━━━━\n\n`;
  state.kader.forEach((k,i) => {
    msg += `${i+1}. *${k.nama||'(tanpa nama)'}*\n`;
    if (k.naqib) msg += `   Naqib: ${k.naqib}\n`;
    if (k.jenjang) msg += `   Jenjang: ${k.jenjang}\n`;
    if (k.hp) msg += `   HP: ${k.hp}\n`;
    if ((k.binaan||[]).length) msg += `   Binaan: ${k.binaan.length} orang\n`;
    msg += `\n`;
  });
  msg += `━━━━━━━━━━━━━━━━━━━━\nTotal: ${state.kader.length} kader`;
  openWA(msg);
}
function sendWAReminder() {
  const list = getUpcomingActivities();
  if (!list.length) { toast('Kosong', 'Belum ada agenda.', 'warn'); return; }
  let msg = `*🔔 REMINDER KEGIATAN*\n*UPA ${state.identitas.nama}*\n━━━━━━━━━━━━━━━━━━━━\n\nAssalamu'alaikum,\n\nAgenda terdekat:\n\n`;
  list.slice(0,10).forEach(a => { msg += `${a.ico||'📌'} *${a.nama}*\n   🗓️ ${a.hari}, ${a.jam}\n   ⏳ ${a.label} lagi\n   👤 PIC: ${a.pic}\n\n`; });
  msg += `━━━━━━━━━━━━━━━━━━━━\nJazakumullahu khairan 🤲`;
  openWA(msg);
}
function sendWASingle(id) {
  const p = state.progja.find(x => x.id === id);
  if (!p) return;
  const next = getNextOccurrence(p.hari, p.jam);
  if (!next) return;
  const diff = next - new Date();
  openWA(`*🔔 PENGINGAT*\n\n${p.ico||'📌'} *${p.nama}*\n🗓️ ${p.hari}, ${p.jam}\n⏳ ${formatDiff(diff)} lagi\n👤 PIC: ${p.pic}\n\nBarakallahu fiikum 🤲`);
}
function sendWAStatistik() {
  const usroh = state.statistik.usroh;
  const total = usroh.reduce((s,x)=>s+(+x.jumlah||0),0);
  let msg = `*📊 STATISTIK USROH*\n*UPA ${state.identitas.nama}*\n━━━━━━━━━━━━━━━━━━━━\n\n*Komposisi Kader:*\n`;
  usroh.forEach(u => { msg += `• ${u.mustawa}: *${u.jumlah}* orang\n`; });
  msg += `\n*Total: ${total} kader*\n\n━━━━━━━━━━━━━━━━━━━━\n${formatDateID(new Date())}`;
  openWA(msg);
}
function sendWAMutabaah() {
  const m = state.mutabaah;
  let msg = `*✅ MUTABAAH YAUMIAH*\n*UPA ${state.identitas.nama}*\n━━━━━━━━━━━━━━━━━━━━\nTanggal: ${m.tanggal}\nPekan: ${m.pekan}\n\n*Anggota:* ${m.members.join(', ')}\n\n`;
  m.agenda.forEach((a, i) => { const scores = m.members.map((_, ci) => m.values[i+'-'+ci] || '-'); msg += `${i+1}. ${a.nama} (target: ${a.target||'-'})\n   [${scores.join('|')}]\n`; });
  msg += `\n━━━━━━━━━━━━━━━━━━━━\nBarakallahu fiikum 🤲`;
  openWA(msg);
}
window.sendWAStruktur = sendWAStruktur;
window.sendWAKader = sendWAKader;
window.sendWAReminder = sendWAReminder;
window.sendWASingle = sendWASingle;
window.sendWAStatistik = sendWAStatistik;
window.sendWAMutabaah = sendWAMutabaah;

  </body></html>`;
  const blob = new Blob(['\ufeff', html], { type: 'application/vnd.ms-excel' });

/* ============ PENGATURAN CLOUD ============ */

    ${!connected ? `
    <div class="card">
      <div class="card-head"><span class="ico">📖</span><h2>Cara Setup (3 Menit dari HP)</h2></div>
      <div style="font-size:13px; line-height:1.8">
        <div style="margin-bottom:10px"><b>1.</b> Buka <a href="https://jsonbin.io" target="_blank" style="color:var(--primary)"><b>jsonbin.io</b></a> di Chrome → <b>Sign Up</b></div>
        <div style="margin-bottom:10px"><b>2.</b> Tap <b>Bins</b> → <b>Create Bin</b> → paste: <code>{"app":"raker-upa","data":null}</code> → <b>Create</b></div>
        <div style="margin-bottom:10px"><b>3.</b> Copy <b>BIN ID</b></div>
        <div style="margin-bottom:10px"><b>4.</b> Tap foto profil → <b>API Keys</b> → copy <b>X-MASTER-KEY</b></div>
        <div><b>5.</b> Paste keduanya di bawah 👇</div>
      </div>
    </div>
    ` : `<div class="info-box success"><b>✅ Terhubung ke JSONBin Cloud</b><br>Data disinkronkan ke cloud.</div>`}
    <div class="card">
      <div class="card-head"><span class="ico">🔑</span><h2>Kredensial JSONBin</h2></div>
      <div class="form-row"><div class="form-group"><label>Bin ID</label><input type="text" id="cloud_bin" value="${esc(state.cloud.binId)}" placeholder="65abc123def456..."></div></div>
      <div class="form-row"><div class="form-group"><label>Master Key (X-MASTER-KEY)</label><input type="password" id="cloud_key" value="${esc(state.cloud.masterKey)}" placeholder="$2b$10$..."></div></div>
      <div class="form-row cols-2">
        <div class="form-group"><label>Auto-Sync (setelah edit)</label>
          <select id="cloud_auto"><option value="1" ${state.cloud.autoSync?'selected':''}>Aktif</option><option value="0" ${!state.cloud.autoSync?'selected':''}>Nonaktif</option></select></div>
      </div>
      <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:8px">
        <button class="btn btn-outline" id="btnTest">🔌 Test Koneksi</button>
        <button class="btn btn-primary" id="btnSaveCloud">💾 Simpan</button>
        <button class="btn btn-primary" id="btnUpload">⬆️ Kirim ke Cloud</button>
        <button class="btn btn-primary" id="btnDownload">⬇️ Tarik dari Cloud</button>
      </div>
    </div>
    <div class="card">
      <div class="card-head"><span class="ico">💾</span><h2>Backup Lokal</h2></div>
      <div style="display:flex; gap:10px; flex-wrap:wrap">
        <button class="btn btn-primary" id="btnBackup">⬇️ Backup JSON</button>
        <label class="btn btn-outline" style="cursor:pointer">⬆️ Restore JSON<input type="file" id="fileRestore" accept=".json" style="display:none"></label>
        <button class="btn btn-danger" id="btnReset">🗑️ Reset Semua</button>
      </div>
    </div>
    <div class="card">
      <div class="card-head"><span class="ico">🔔</span><h2>Izin Notifikasi Browser</h2></div>
      <p style="font-size:13px; color:var(--muted); margin-bottom:10px">Status: <b>${('Notification' in window) ? Notification.permission : 'tidak didukung'}</b></p>
      <button class="btn btn-primary" onclick="requestNotifPerm()">🔔 Minta Izin</button>
    </div>
  `;
  const binEl = document.getElementById('cloud_bin');
  const keyEl = document.getElementById('cloud_key');
  document.getElementById('btnTest').onclick = testCloud;
  document.getElementById('btnSaveCloud').onclick = () => {
    state.cloud.binId = binEl.value.trim(); state.cloud.masterKey = keyEl.value.trim();
    state.cloud.autoSync = document.getElementById('cloud_auto').value === '1';
    saveState(); toast('Tersimpan', 'Kredensial cloud disimpan.'); renderPage();
  };
  document.getElementById('btnUpload').onclick = () => {
    state.cloud.binId = binEl.value.trim(); state.cloud.masterKey = keyEl.value.trim();
    state.cloud.autoSync = document.getElementById('cloud_auto').value === '1';
    saveState(); syncToCloud(false);
  };
  document.getElementById('btnDownload').onclick = () => {
    state.cloud.binId = binEl.value.trim(); state.cloud.masterKey = keyEl.value.trim();
    state.cloud.autoSync = document.getElementById('cloud_auto').value === '1';
    saveState(); syncFromCloud(false);
  };
  document.getElementById('btnBackup').onclick = () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `backup-raker-upa-${new Date().toISOString().slice(0,10)}.json`;
    a.click(); toast('Berhasil', 'Backup diunduh.');
  };
  document.getElementById('fileRestore').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const imp = JSON.parse(r.result);
        const myBin = state.cloud.binId, myKey = state.cloud.masterKey;
        state = deepMerge(JSON.parse(JSON.stringify(DEFAULT_STATE)), imp);
        state.cloud.binId = myBin; state.cloud.masterKey = myKey;
        state.kader.forEach(k => { if (!Array.isArray(k.binaan)) k.binaan = []; });
        saveState(); toast('Berhasil', 'Data dipulihkan.'); renderPage();
      } catch(err) { toast('Gagal', 'File tidak valid.', 'danger'); }
    };
    r.readAsText(f);
  };
  document.getElementById('btnReset').onclick = () => {
    if (!confirm('Yakin reset SEMUA data?')) return;
    const bin = state.cloud.binId, key = state.cloud.masterKey;
    state = JSON.parse(JSON.stringify(DEFAULT_STATE));
    state.cloud.binId = bin; state.cloud.masterKey = key;
    saveState(); toast('Direset', 'Semua data telah direset.'); goPage('dashboard');
  };
}
function requestNotifPerm() {
  if (!('Notification' in window)) { toast('Tidak Didukung', 'Browser tidak mendukung notif.', 'danger'); return; }
  Notification.requestPermission().then(p => {
    if (p === 'granted') { toast('Berhasil', 'Notifikasi diaktifkan.'); new Notification('🕌 Raker UPA', { body: 'Notifikasi siap.' }); }
    else toast('Ditolak', 'Buka pengaturan browser untuk izinkan.', 'danger');
    renderPage();
  });
}
window.requestNotifPerm = requestNotifPerm;

/* ============ REMINDER ENGINE ============ */
const notifiedKeys = new Set();
const notifiedAbsenKeys = new Set();
function checkReminders(silent) {
  if (!state.settings.reminderEnabled) return;
  const now = new Date();
  const ahead = (state.settings.reminderMinutes || 30) * 60000;
  let upcomingCount = 0;
  state.progja.forEach(p => {
    const next = getNextOccurrence(p.hari, p.jam);
    if (!next) return;
    const diff = next - now;
    if (diff > 0 && diff <= ahead) upcomingCount++;
    if (diff > 0 && diff <= ahead) {
      const key = p.id + '|' + next.toISOString().slice(0, 13);
      if (!notifiedKeys.has(key)) {
        notifiedKeys.add(key);
        if (!silent) {
          toast(`⏰ ${p.nama}`, `Akan dimulai dalam ${formatDiff(diff)} (${p.hari}, ${p.jam})`, 'warn');
          if ('Notification' in window && Notification.permission === 'granted') {
            try { new Notification(`⏰ ${p.nama}`, { body: `Dalam ${formatDiff(diff)} — ${p.hari}, ${p.jam}` }); } catch(e){}
          }
        }
      }
    }
  });
  if (state.absensiReminder && state.absensiReminder.enabled) {
    const perlu = getKegiatanPerluAbsensi();
    perlu.forEach(k => {
      const key = 'abs|' + k.tanggal;
      if (!notifiedAbsenKeys.has(key)) {
        notifiedAbsenKeys.add(key);
        if (!silent) {
          const label = k.items.length > 1 ? `${k.items.length} kegiatan pada ${formatDateShort(k.tanggal)}` : `${k.items[0].nama} (${formatDateShort(k.tanggal)})`;
          toast(`📋 Absensi belum diisi`, label, 'warn');
        }
      }
    });
  }
  const badge = document.getElementById('bellBadge');
  if (badge) {
    const perluAbs = getKegiatanPerluAbsensi().length;
    const total = upcomingCount + perluAbs;
    if (total > 0) { badge.textContent = total; badge.classList.remove('hidden'); }
    else badge.classList.add('hidden');
  }
}

/* ============ AUTO UPDATE ============ */
(async function autoUpdate() {
  try {
    const res = await fetch(location.pathname, { method: 'HEAD', cache: 'no-store' });
    const serverLM = res.headers.get('last-modified');
    const pageLM = document.lastModified;
    if (!serverLM || !pageLM) return;
    if (new Date(serverLM).getTime() > new Date(pageLM).getTime() + 2000) {
      const url = new URL(location.href);
      url.searchParams.set('v', Date.now());
      location.replace(url.toString());
    }
  } catch (e) {}
})();
setInterval(() => {
  (async () => {
    try {
      const res = await fetch(location.pathname, { method: 'HEAD', cache: 'no-store' });
      const serverLM = res.headers.get('last-modified');
      const pageLM = document.lastModified;
      if (!serverLM || !pageLM) return;
      if (new Date(serverLM).getTime() > new Date(pageLM).getTime() + 2000) {
        const url = new URL(location.href);
        url.searchParams.set('v', Date.now());
        location.replace(url.toString());
      }
    } catch (e) {}
  })();
}, 5 * 60 * 1000);
