<!DOCTYPE html>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --primary: #0d9488;
    --primary-dark: #0f766e;
    --primary-light: #ccfbf1;
    --accent: #f59e0b;
    --accent-light: #fef3c7;
    --bg: #f1f5f9;
    --card: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --border: #e2e8f0;
    --danger: #ef4444;
    --success: #10b981;
    --wa: #25D366;
    --sidebar: #0f2e2b;
    --sidebar-hover: #134e4a;
  }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; overflow-x: hidden;
  }
  .app { display: flex; min-height: 100vh; }

  /* SIDEBAR */
  .sidebar {
    width: 250px; background: var(--sidebar); color: #e2e8f0;
    display: flex; flex-direction: column;
    position: fixed; top: 0; left: 0; bottom: 0;
    z-index: 100; transition: transform .3s;
  }
  .brand {
    display: flex; align-items: center; gap: 12px;
    padding: 20px 18px; border-bottom: 1px solid rgba(255,255,255,.08);
  }
  .brand-logo {
    font-size: 28px;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    width: 46px; height: 46px; border-radius: 12px;
    display: grid; place-items: center;
    box-shadow: 0 4px 12px rgba(13,148,136,.4);
  }
  .brand-title { font-weight: 800; font-size: 15px; letter-spacing: .5px; color: #fff; }
  .brand-sub { font-size: 12px; color: #94a3b8; }
  nav { flex: 1; padding: 12px 10px; overflow-y: auto; }
  .nav-item {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 14px; border-radius: 10px;
    cursor: pointer; margin-bottom: 3px;
    font-size: 14px; font-weight: 500;
    color: #cbd5e1; transition: all .2s; user-select: none;
  }
  .nav-item:hover { background: var(--sidebar-hover); color: #fff; }
  .nav-item.active {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff; box-shadow: 0 4px 12px rgba(13,148,136,.35);
  }
  .nav-item .ico { font-size: 18px; width: 22px; text-align: center; }
  .sidebar-footer {
    padding: 14px; font-size: 11px; color: #64748b;
    text-align: center; border-top: 1px solid rgba(255,255,255,.08);
  }

  /* MAIN */
  .main { flex: 1; margin-left: 250px; display: flex; flex-direction: column; min-width: 0; }
  .topbar {
    background: #fff; padding: 14px 22px;
    display: flex; align-items: center; gap: 14px;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 50;
  }
  .menu-btn {
    display: none; background: none; border: none;
    font-size: 22px; cursor: pointer; color: var(--text);
  }
  .topbar h1 { font-size: 18px; font-weight: 700; flex: 1; }
  .topbar-actions { display: flex; align-items: center; gap: 10px; }
  .icon-btn {
    position: relative; background: var(--bg);
    border: 1px solid var(--border);
    width: 40px; height: 40px; border-radius: 10px;
    font-size: 18px; cursor: pointer;
    display: grid; place-items: center; transition: all .2s;
  }
  .icon-btn:hover { background: var(--primary-light); border-color: var(--primary); }
  .icon-btn .badge {
    position: absolute; top: -4px; right: -4px;
    background: var(--danger); color: #fff;
    font-size: 10px; font-weight: 700;
    min-width: 18px; height: 18px; border-radius: 9px;
    display: grid; place-items: center; padding: 0 4px;
    border: 2px solid #fff;
  }
  .badge.hidden { display: none; }
  .btn {
    padding: 9px 16px; border-radius: 10px;
    border: none; cursor: pointer;
    font-size: 13px; font-weight: 600;
    transition: all .2s;
    display: inline-flex; align-items: center; gap: 6px;
    text-decoration: none;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); }
  .btn-outline { background: #fff; color: var(--text); border: 1px solid var(--border); }
  .btn-outline:hover { border-color: var(--primary); color: var(--primary); }
  .btn-wa { background: var(--wa); color: #fff; }
  .btn-wa:hover { background: #128C7E; transform: translateY(-1px); }
  .btn-danger { background: #fee2e2; color: var(--danger); }
  .btn-danger:hover { background: var(--danger); color: #fff; }
  .btn-sm { padding: 6px 10px; font-size: 12px; }

  .content { padding: 22px; flex: 1; }

  /* CARDS */
  .card {
    background: var(--card); border-radius: 14px;
    border: 1px solid var(--border); padding: 20px;
    margin-bottom: 18px;
    box-shadow: 0 1px 3px rgba(0,0,0,.04);
  }
  .card-head {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 16px; padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .card-head h2 { font-size: 16px; font-weight: 700; flex: 1; }
  .card-head .ico { font-size: 20px; }

  /* GRID */
  .grid { display: grid; gap: 16px; }
  .grid-2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  .grid-3 { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
  .grid-4 { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }

  /* STAT */
  .stat {
    background: var(--card); border-radius: 14px;
    padding: 18px; border: 1px solid var(--border);
    display: flex; align-items: center; gap: 14px;
    transition: transform .2s, box-shadow .2s;
  }
  .stat:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,.07); }
  .stat-ico {
    width: 48px; height: 48px; border-radius: 12px;
    display: grid; place-items: center; font-size: 22px; flex-shrink: 0;
  }
  .stat-ico.green { background: var(--primary-light); }
  .stat-ico.amber { background: var(--accent-light); }
  .stat-ico.blue { background: #dbeafe; }
  .stat-ico.pink { background: #fce7f3; }
  .stat-ico.purple { background: #ede9fe; }
  .stat-val { font-size: 22px; font-weight: 800; line-height: 1.1; }
  .stat-lbl { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* FORM */
  .form-row { display: grid; gap: 14px; margin-bottom: 14px; }
  .form-row.cols-2 { grid-template-columns: 1fr 1fr; }
  .form-row.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
  .form-group label {
    display: block; font-size: 12px; font-weight: 600;
    color: var(--muted); margin-bottom: 5px;
    text-transform: uppercase; letter-spacing: .4px;
  }
  input[type="text"], input[type="number"], input[type="time"], input[type="date"],
  input[type="tel"], select, textarea {
    width: 100%; padding: 10px 12px;
    border: 1px solid var(--border); border-radius: 9px;
    font-size: 14px; font-family: inherit;
    background: #fff; color: var(--text);
    transition: border .2s, box-shadow .2s;
  }
  input:focus, select:focus, textarea:focus {
    outline: none; border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(13,148,136,.12);
  }
  textarea { resize: vertical; min-height: 70px; }

  /* TABLE */
  .tbl-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid var(--border); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; background: #fff; }
  th {
    background: #f8fafc; text-align: left;
    padding: 11px 12px; font-weight: 700;
    font-size: 12px; color: var(--muted);
    text-transform: uppercase; letter-spacing: .3px;
    border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  td {
    padding: 10px 12px;
    border-bottom: 1px solid #f1f5f9;
    vertical-align: middle;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #f8fafc; }
  td input, td select { padding: 7px 9px; font-size: 13px; border-radius: 7px; }
  .td-actions { display: flex; gap: 6px; }
  .mini-btn {
    background: none; border: none; cursor: pointer;
    font-size: 15px; padding: 4px 6px; border-radius: 6px;
    transition: background .2s;
  }
  .mini-btn:hover { background: var(--bg); }

  /* Kolom Nama yang lebih lebar */
  .col-nama { min-width: 200px; }
  .col-nama input { min-width: 180px; }

  /* TAG */
  .tag {
    display: inline-block; padding: 3px 9px; border-radius: 20px;
    font-size: 11px; font-weight: 700;
    background: var(--primary-light); color: var(--primary-dark);
  }
  .tag.amber { background: var(--accent-light); color: #92400e; }
  .tag.blue { background: #dbeafe; color: #1e40af; }
  .tag.pink { background: #fce7f3; color: #9d174d; }
  .tag.red { background: #fee2e2; color: #991b1b; }
  .tag.wa { background: #dcfce7; color: #166534; }

  /* REMINDER */
  .rem-item {
    display: flex; align-items: center; gap: 14px;
    padding: 13px 15px; border-radius: 11px;
    background: #fff; border: 1px solid var(--border);
    margin-bottom: 10px; transition: all .2s;
  }
  .rem-item:hover { border-color: var(--primary); box-shadow: 0 4px 12px rgba(13,148,136,.1); }
  .rem-item.soon { border-color: var(--accent); background: #fffbeb; }
  .rem-ico {
    width: 42px; height: 42px; border-radius: 11px;
    display: grid; place-items: center; font-size: 20px;
    background: var(--primary-light); flex-shrink: 0;
  }
  .rem-item.soon .rem-ico { background: var(--accent-light); }
  .rem-body { flex: 1; min-width: 0; }
  .rem-title { font-weight: 700; font-size: 14px; }
  .rem-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .rem-count {
    font-size: 12px; font-weight: 800; text-align: right;
    color: var(--primary-dark); white-space: nowrap;
  }
  .rem-item.soon .rem-count { color: #b45309; }

  /* TOAST */
  .toast-container {
    position: fixed; top: 20px; right: 20px;
    z-index: 9999; display: flex; flex-direction: column; gap: 10px;
    max-width: 360px;
  }
  .toast {
    background: #fff; border-left: 4px solid var(--primary);
    border-radius: 12px; padding: 14px 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,.15);
    display: flex; gap: 12px; align-items: flex-start;
    animation: slideIn .35s ease;
  }
  .toast.warn { border-left-color: var(--accent); }
  .toast.danger { border-left-color: var(--danger); }
  .toast.wa { border-left-color: var(--wa); }
  .toast .t-ico { font-size: 22px; }
  .toast .t-title { font-weight: 700; font-size: 13px; }
  .toast .t-msg { font-size: 12px; color: var(--muted); margin-top: 2px; }
  @keyframes slideIn {
    from { transform: translateX(120%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  /* PROGRESS */
  .progress { height: 8px; background: #e2e8f0; border-radius: 5px; overflow: hidden; margin-top: 6px; }
  .progress > div {
    height: 100%; border-radius: 5px;
    background: linear-gradient(90deg, var(--primary), var(--accent));
    transition: width .5s;
  }

  /* MODAL */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(15,23,42,.55);
    display: none; align-items: center; justify-content: center;
    z-index: 9998; padding: 20px; backdrop-filter: blur(3px);
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: #fff; border-radius: 16px;
    max-width: 560px; width: 100%;
    max-height: 90vh; overflow-y: auto;
    padding: 24px; animation: popIn .25s ease;
  }
  @keyframes popIn { from { transform: scale(.94); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal h3 { font-size: 17px; margin-bottom: 16px; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }

  .empty { text-align: center; padding: 40px 20px; color: var(--muted); }
  .empty .e-ico { font-size: 46px; margin-bottom: 10px; opacity: .55; }
  .empty p { font-size: 13px; }

  .section-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-bottom: 18px; flex-wrap: wrap;
  }
  .section-head h2 { font-size: 20px; font-weight: 800; }
  .section-head .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }

  /* MUTABAAH */
  .mut-table td input { width: 100%; text-align: center; padding: 4px; font-size: 12px; }
  .mut-table th { text-align: center; font-size: 11px; padding: 8px 4px; }
  .mut-table td:first-child { text-align: left; font-weight: 600; }
  .mut-table th:first-child, .mut-table td:first-child {
    position: sticky; left: 0; background: #fff; z-index: 2; min-width: 200px;
  }
  .mut-table th:first-child { background: #f8fafc; }

  /* REPORT MENU */
  .report-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
  .report-card {
    background: #fff; border-radius: 14px; border: 1px solid var(--border);
    padding: 22px; cursor: pointer; transition: all .25s;
    text-align: center;
  }
  .report-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 28px rgba(0,0,0,.1);
    border-color: var(--primary);
  }
  .report-card .r-ico { font-size: 38px; margin-bottom: 12px; display: block; }
  .report-card .r-title { font-weight: 800; font-size: 15px; margin-bottom: 6px; }
  .report-card .r-desc { font-size: 12px; color: var(--muted); line-height: 1.5; }

  /* PRINT */
  @media print {
    body * { visibility: hidden; }
    #printArea, #printArea * { visibility: visible; }
    #printArea {
      position: absolute; left: 0; top: 0; width: 100%;
      background: #fff; padding: 20px;
    }
    .no-print { display: none !important; }
  }
  #printArea { display: none; }

  /* RESPONSIVE */
  @media (max-width: 900px) {
    .sidebar { transform: translateX(-100%); }
    .sidebar.open { transform: translateX(0); }
    .main { margin-left: 0; }
    .menu-btn { display: block; }
    .form-row.cols-2, .form-row.cols-3 { grid-template-columns: 1fr; }
    .content { padding: 14px; }
    .topbar h1 { font-size: 15px; }
    .btn .btn-text { display: none; }
    .btn.btn-wa .btn-text, .btn.btn-primary .btn-text { display: inline; }
  }
  @media (max-width: 500px) {
    .btn .btn-text { display: none !important; }
    .topbar-actions .btn { padding: 8px 10px; }
  }
</style>
</head>

let state = loadState();

function loadState() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return JSON.parse(JSON.stringify(DEFAULT_STATE));
    return deepMerge(JSON.parse(JSON.stringify(DEFAULT_STATE)), JSON.parse(raw));
  } catch(e) { return JSON.parse(JSON.stringify(DEFAULT_STATE)); }
}
function deepMerge(base, over) {
  for (const k in over) {
    if (over[k] && typeof over[k] === 'object' && !Array.isArray(over[k])) {
      base[k] = deepMerge(base[k] || {}, over[k]);
    } else { base[k] = over[k]; }
  }
  return base;
}
function saveState() { localStorage.setItem(LS_KEY, JSON.stringify(state)); }

============================================================ */
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function toast(title, msg, type='') {
  const c = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = `<div class="t-ico">${type==='warn'?'⏰':type==='danger'?'❗':type==='wa'?'📱':'🔔'}</div>
    <div style="flex:1"><div class="t-title">${esc(title)}</div><div class="t-msg">${esc(msg)}</div></div>`;
  c.appendChild(el);
  setTimeout(() => { el.style.opacity='0'; el.style.transform='translateX(120%)'; el.style.transition='all .35s'; }, 5000);
  setTimeout(() => el.remove(), 5500);
}
function openModal(html) {
  document.getElementById('modalBox').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('show');
}
function closeModal() { document.getElementById('modalOverlay').classList.remove('show'); }
document.getElementById('modalOverlay').onclick = e => { if (e.target.id === 'modalOverlay') closeModal(); };

function formatDateID(d) {
  const bln = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  return `${d.getDate()} ${bln[d.getMonth()]} ${d.getFullYear()}`;
}

============================================================ */
function getNextOccurrence(hari, jam) {
  if (!hari || !jam) return null;
  const targetDay = DAYS.indexOf(hari);
  if (targetDay < 0) return null;
  const [h, mi] = jam.split(':').map(Number);
  if (isNaN(h)) return null;
  const now = new Date();
  const next = new Date(now);
  next.setHours(h, mi || 0, 0, 0);
  let diff = (targetDay - now.getDay() + 7) % 7;
  if (diff === 0 && next <= now) diff = 7;
  next.setDate(now.getDate() + diff);
  return next;
}
function formatDiff(ms) {
  const min = Math.round(ms / 60000);
  if (min < 60) return `${min} menit`;
  const hr = Math.floor(min / 60);
  if (hr < 24) return `${hr} jam ${min % 60}m`;
  const d = Math.floor(hr / 24);
  return `${d} hari ${hr % 24}j`;
}
function getUpcomingActivities() {
  const now = new Date();
  const list = [];
  state.progja.forEach(p => {
    const next = getNextOccurrence(p.hari, p.jam);
    if (!next) return;
    const diff = next - now;
    list.push({ ...p, next, diff, soon: diff < 3600000, label: formatDiff(diff) });
  });
  list.sort((a, b) => a.diff - b.diff);
  return list;
}

/* ============================================================
   WHATSAPP FUNCTIONS
============================================================ */
function openWA(text) {
  const num = state.wa.defaultNumber || '';
  const url = num ? `https://wa.me/${num}?text=${encodeURIComponent(text)}` : `https://wa.me/?text=${encodeURIComponent(text)}`;
  window.open(url, '_blank');
}

function sendWAStruktur() {
  let msg = `*📋 STRUKTUR ANGGOTA*\n*UPA ${state.identitas.nama}*\n`;
  msg += `━━━━━━━━━━━━━━━━━━━━\n\n`;
  state.anggota.forEach((a, i) => {
    msg += `${i+1}. *${a.nama || '(belum diisi)'}*\n`;
    msg += `   Amanah: ${a.amanah}\n`;
    if (a.idSik) msg += `   ID SIK: ${a.idSik}\n`;
    if (a.hp) msg += `   HP: ${a.hp}\n`;
    msg += `\n`;
  });
  msg += `━━━━━━━━━━━━━━━━━━━━\n`;
  msg += `Total: ${state.anggota.length} anggota\n`;
  msg += `Dikirim: ${formatDateID(new Date())}`;
  openWA(msg);
}

function sendWAKader() {
  if (!state.kader.length) { toast('Kosong', 'Belum ada data kader untuk dikirim.', 'warn'); return; }
  let msg = `*👥 DATA KADER*\n*UPA ${state.identitas.nama}*\n`;
  msg += `━━━━━━━━━━━━━━━━━━━━\n\n`;
  state.kader.forEach((k, i) => {
    msg += `${i+1}. *${k.nama || '(tanpa nama)'}*\n`;
    if (k.naqib) msg += `   Naqib: ${k.naqib}\n`;
    if (k.jenjang) msg += `   Jenjang: ${k.jenjang}\n`;
    if (k.hp) msg += `   HP: ${k.hp}\n`;
    if (k.kecamatan) msg += `   Kec: ${k.kecamatan}\n`;
    msg += `\n`;
  });
  msg += `━━━━━━━━━━━━━━━━━━━━\n`;
  msg += `Total: ${state.kader.length} kader`;
  openWA(msg);
}

function sendWAReminder() {
  const list = getUpcomingActivities();
  if (!list.length) { toast('Kosong', 'Belum ada agenda terjadwal.', 'warn'); return; }
  let msg = `*🔔 REMINDER KEGIATAN*\n*UPA ${state.identitas.nama}*\n`;
  msg += `━━━━━━━━━━━━━━━━━━━━\n\n`;
  msg += `Assalamu'alaikum warahmatullahi wabarakatuh,\n\nBerikut agenda terdekat kita:\n\n`;
  list.slice(0, 10).forEach((a, i) => {
    msg += `${a.ico || '📌'} *${a.nama}*\n`;
    msg += `   🗓️ ${a.hari}, ${a.jam}\n`;
    msg += `   ⏳ ${a.label} lagi\n`;
    msg += `   👤 PIC: ${a.pic}\n\n`;
  });
  msg += `━━━━━━━━━━━━━━━━━━━━\n`;
  msg += `Mohon persiapan & kehadirannya. Jazakumullahu khairan 🤲`;
  openWA(msg);
}

function sendWASingle(id) {
  const p = state.progja.find(x => x.id === id);
  if (!p) return;
  const next = getNextOccurrence(p.hari, p.jam);
  if (!next) return;
  const diff = next - new Date();
  let msg = `*🔔 PENGINGAT KEGIATAN*\n\n`;
  msg += `${p.ico || '📌'} *${p.nama}*\n`;
  msg += `🗓️ ${p.hari}, ${p.jam}\n`;
  msg += `⏳ ${formatDiff(diff)} lagi\n`;
  msg += `👤 PIC: ${p.pic}\n`;
  msg += `📆 ${p.periode}\n\n`;
  msg += `Mohon hadir tepat waktu. Barakallahu fiikum 🤲`;
  openWA(msg);
}

function sendWAStatistik() {
  const usroh = state.statistik.usroh;
  const total = usroh.reduce((s,x)=>s+(+x.jumlah||0),0);
  let msg = `*📊 LAPORAN STATISTIK USROH*\n*UPA ${state.identitas.nama}*\n`;
  msg += `━━━━━━━━━━━━━━━━━━━━\n\n`;
  msg += `*Komposisi Kader per Mustawa:*\n`;
  usroh.forEach(u => { msg += `• ${u.mustawa}: *${u.jumlah}* orang\n`; });
  msg += `\n*Total Kader: ${total} orang*\n\n`;
  msg += `*Target s.d. Desember:*\n`;
  state.statistik.target.forEach(t => {
    const jlh = (+t.kader||0)*(+t.beban||0);
    msg += `• ${t.mustawa}: ${t.kader} × ${t.beban} = *${jlh}*\n`;
  });
  msg += `\n━━━━━━━━━━━━━━━━━━━━\n`;
  msg += `Dikirim: ${formatDateID(new Date())}`;
  openWA(msg);
}

function sendWAMutabaah() {
  const m = state.mutabaah;
  let msg = `*✅ LAPORAN MUTABAAH YAUMIAH*\n*UPA ${state.identitas.nama}*\n`;
  msg += `━━━━━━━━━━━━━━━━━━━━\n`;
  msg += `Tanggal: ${m.tanggal}\nPekan: ${m.pekan}\n\n`;
  msg += `*Anggota:* ${m.members.join(', ')}\n\n`;
  msg += `*Agenda:*\n`;
  m.agenda.forEach((a, i) => {
    const scores = m.members.map((_, ci) => m.values[i+'-'+ci] || '-');
    msg += `${i+1}. ${a.nama} (target: ${a.target || '-'})\n`;
    msg += `   [${scores.join('|')}]\n`;
  });
  msg += `\n━━━━━━━━━━━━━━━━━━━━\nBarakallahu fiikum 🤲`;
  openWA(msg);
}

function sendWADashboard() {
  let msg = `*🕌 RINGKASAN UPA ${state.identitas.nama}*\n`;
  msg += `━━━━━━━━━━━━━━━━━━━━\n\n`;
  msg += `👥 Anggota: *${state.anggota.length}*\n`;
  msg += `📋 Program Kerja: *${state.progja.length}*\n`;
  msg += `📚 Materi Tarbiyah: *${state.materi.length}*\n`;
  msg += `👤 Data Kader: *${state.kader.length}*\n\n`;
  const list = getUpcomingActivities().slice(0, 3);
  if (list.length) {
    msg += `*🔔 Agenda Terdekat:*\n`;
    list.forEach(a => { msg += `• ${a.nama} — ${a.hari}, ${a.jam} (${a.label})\n`; });
  }
  msg += `\n━━━━━━━━━━━━━━━━━━━━\n${formatDateID(new Date())}`;
  openWA(msg);
}

}

function importBackup(file, cb) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const imported = JSON.parse(r.result);
      state = deepMerge(JSON.parse(JSON.stringify(DEFAULT_STATE)), imported);
      saveState();
      toast('Berhasil', 'Data berhasil dipulihkan.');
      if (cb) cb();
    } catch(e) { toast('Gagal', 'File backup tidak valid.', 'danger'); }
  };
  r.readAsText(file);
}

      <div class="card-head"><span class="ico">💾</span><h2>Backup & Restore</h2></div>
      <p style="font-size:13px; color:var(--muted); margin-bottom:14px">
        Backup seluruh data aplikasi ke file JSON, atau pulihkan dari file backup.
      </p>
      <div style="display:flex; gap:10px; flex-wrap:wrap">
        <button class="btn btn-primary" id="btnExport2">⬇️ Backup Data</button>
        <label class="btn btn-outline" style="cursor:pointer">
          ⬆️ Restore Data
          <input type="file" id="fileImport2" accept=".json" style="display:none">
        </label>
        <button class="btn btn-danger" id="btnReset2">🗑️ Reset Semua Data</button>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><span class="ico">📤</span><h2>Export Laporan</h2></div>
      <div style="display:flex; gap:10px; flex-wrap:wrap">
        <button class="btn btn-primary" onclick="exportExcel()">📊 Export Excel</button>
        <button class="btn btn-primary" onclick="exportPDF()">📄 Export PDF</button>
        <button class="btn btn-wa" onclick="goPage('laporan')">📱 Laporan WA</button>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><span class="ico">🔔</span><h2>Izin Notifikasi Browser</h2></div>
      <p style="font-size:13px; color:var(--muted); margin-bottom:14px">
        Status: <b id="permStatus">${('Notification' in window) ? Notification.permission : 'tidak didukung'}</b>
      </p>
      <button class="btn btn-primary" id="reqPermBtn">🔔 Minta Izin Notifikasi</button>
    </div>

    <div class="card">
      <div class="card-head"><span class="ico">ℹ️</span><h2>Tentang</h2></div>
      <div style="font-size:13px; line-height:1.8; color:var(--muted)">
        <div><b style="color:var(--text)">Raker UPA A.H Nasution</b> — Sistem Manajemen Usroh</div>
        <div>Versi 2.0 • 2026/2027</div>
        <div>Fitur: Identitas, Anggota, Progja, Materi, Kader, Statistik, Mutabaah, Reminder WA, Export Excel/PDF, Backup/Restore.</div>
        <div style="margin-top:8px">Data tersimpan otomatis di browser (localStorage).</div>
      </div>
    </div>
  `;

  document.getElementById('btnExport2').onclick = exportBackup;
  document.getElementById('fileImport2').onchange = e => {
    const f = e.target.files[0];
    if (f) importBackup(f, () => { renderPage(); });
  };
  document.getElementById('btnReset2').onclick = () => {
    if (!confirm('Yakin reset SEMUA data? Tidak bisa dibatalkan.')) return;
    localStorage.removeItem(LS_KEY);
    state = JSON.parse(JSON.stringify(DEFAULT_STATE));
    saveState();
    toast('Direset', 'Semua data telah direset.');
    goPage('dashboard');
  };
  document.getElementById('reqPermBtn').onclick = requestNotifPerm;
}

function requestNotifPerm() {
  if (!('Notification' in window)) { toast('Tidak Didukung', 'Browser tidak mendukung notifikasi.', 'danger'); return; }
  Notification.requestPermission().then(p => {
    const el = document.getElementById('permStatus');
    if (el) el.textContent = p;
    if (p === 'granted') {
      toast('Berhasil', 'Notifikasi browser diaktifkan.');
      new Notification('🕌 Raker UPA', { body: 'Notifikasi siap. Anda akan diingatkan untuk setiap kegiatan.' });
    } else {
      toast('Ditolak', 'Izin notifikasi tidak diberikan.', 'danger');
    }
  });
}
window.requestNotifPerm = requestNotifPerm;

/* ============================================================
   REMINDER ENGINE
============================================================ */
function showNotification(title, body) {
  toast(title, body, 'warn');
  if ('Notification' in window && Notification.permission === 'granted') {
    try {
      new Notification(title, { body, icon: 'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕌</text></svg>' });
    } catch(e){}
  }
}

const notifiedKeys = new Set();
function checkReminders(silent = false) {
  if (!state.settings.reminderEnabled) return;
  const now = new Date();
  const ahead = (state.settings.reminderMinutes || 30) * 60000;
  let upcomingCount = 0;
  state.progja.forEach(p => {
    const next = getNextOccurrence(p.hari, p.jam);
    if (!next) return;
    const diff = next - now;
    if (diff > 0 && diff <= ahead) upcomingCount++;
    if (diff > 0 && diff <= ahead) {
      const key = p.id + '|' + next.toISOString().slice(0, 13);
      if (!notifiedKeys.has(key)) {
        notifiedKeys.add(key);
        if (!silent) showNotification(`⏰ ${p.nama}`, `Akan dimulai dalam ${formatDiff(diff)} (${p.hari}, ${p.jam}) • PIC: ${p.pic}`);
      }
    }
  });
  const badge = document.getElementById('bellBadge');
  if (upcomingCount > 0) { badge.textContent = upcomingCount; badge.classList.remove('hidden'); }
  else badge.classList.add('hidden');
}

/* ============================================================
   INIT
============================================================ */
document.getElementById('menuBtn').onclick = () => document.getElementById('sidebar').classList.toggle('open');
document.getElementById('bellBtn').onclick = () => goPage('reminder');
document.getElementById('waReportBtn').onclick = () => goPage('laporan');

renderNav();
renderPage();
checkReminders(true);

setInterval(() => checkReminders(false), 30000);
setInterval(() => {
  const list = getUpcomingActivities();
  const soon = list.filter(a => a.diff < 3600000).length;
  const badge = document.getElementById('bellBadge');
  if (soon > 0) { badge.textContent = soon; badge.classList.remove('hidden'); }
  else badge.classList.add('hidden');
}, 60000);

setTimeout(() => toast('🕌 Selamat Datang', `Sistem Raker UPA ${state.identitas.nama} siap digunakan.`), 800);
</script>
