<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kelola Tautan Mutabaah</title><style>body{margin:0;padding:18px;background:#f1f5f9;color:#0f172a;font-family:system-ui,sans-serif}.wrap{max-width:680px;margin:auto}.card{background:white;padding:20px;border:1px solid #e2e8f0;border-radius:16px;margin:14px 0}h1{font-size:24px}label{display:block;font-weight:700;margin:12px 0 6px}input,select,button{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit;box-sizing:border-box}button{background:#0f766e;color:white;font-weight:800;border:0;margin-top:12px}button:disabled{opacity:.6}.muted{color:#64748b;font-size:13px}.status{white-space:pre-wrap;margin-top:12px}.warn{background:#fff7ed;padding:12px;border-radius:10px;font-size:13px}</style></head><body><main class="wrap"><h1>Kelola Tautan Mutabaah</h1><p class="muted">Khusus admin UPA yang profil Firebase-nya aktif. Halaman ini tidak menggantikan RakerGrupUPA.</p><div class="warn">Gunakan hanya setelah aturan Firestore tambahan dipasang dan diuji. Jangan bagikan halaman admin ini kepada binaan.</div><section class="card" id="loginCard"><h2>Masuk Admin</h2><form id="login"><label>Email admin</label><input id="email" type="email" required autocomplete="username"><label>Kata sandi</label><input id="password" type="password" required autocomplete="current-password"><button id="loginBtn">Masuk dan Verifikasi</button></form><p id="loginStatus" class="status"></p></section><section class="card" id="manageCard" hidden><p id="who"></p><label for="binaan">Pilih binaan</label><select id="binaan"><option value="">Memuat binaan…</option></select><button id="create">Buat Tautan Khusus</button><div id="out" class="status"></div><button id="copy" hidden>Salin Tautan</button><button id="logout" style="background:#475569">Keluar</button></section><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js';
import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js';
import{getFirestore,doc,getDoc,getDocs,collection,setDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js';
const cfg={apiKey:'AIzaSyC8tcfOZ4hl7mBImcfTtrU2OtKq9aWJC9s',authDomain:'mutabaah-upa-test.firebaseapp.com',projectId:'mutabaah-upa-test',storageBucket:'mutabaah-upa-test.firebasestorage.app',messagingSenderId:'154416733757',appId:'1:154416733757:web:dc4e727429df8a3d4f1454'};const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),UPA='UPA_TEST_001';const $=id=>document.getElementById(id);let binaanCache=[],currentLink='';
function status(id,t){$(id).textContent=t}function randomToken(){const a=new Uint8Array(32);crypto.getRandomValues(a);return Array.from(a,x=>x.toString(16).padStart(2,'0')).join('')}
async function verify(user){const s=await getDoc(doc(db,'upas',UPA,'users',user.uid));if(!s.exists())throw Error('Profil pengguna tidak ditemukan.');const v=s.data();if(v.aktif!==true||v.role!=='admin_upa'||v.upaId!==UPA)throw Error('Akun ini bukan admin aktif untuk UPA yang benar.');return v}
async function loadBinaan(){const snap=await getDocs(collection(db,'upas',UPA,'binaan'));binaanCache=snap.docs.filter(d=>d.data().aktif===true).map(d=>({id:d.id,nama:d.data().nama||d.data().namaBinaan||d.id}));const s=$('binaan');s.replaceChildren(new Option('Pilih binaan',''));binaanCache.forEach(b=>s.add(new Option(b.nama,b.id)));if(!binaanCache.length)status('out','Belum ada dokumen binaan aktif di Firestore.')}
onAuthStateChanged(auth,async user=>{if(!user){$('manageCard').hidden=true;$('loginCard').hidden=false;return}try{const profile=await verify(user);$('who').textContent='Login terverifikasi: '+(profile.nama||user.email);await loadBinaan();$('loginCard').hidden=true;$('manageCard').hidden=false}catch(e){status('loginStatus',e.message||'Verifikasi gagal.');await signOut(auth)}});
$('login').addEventListener('submit',async e=>{e.preventDefault();$('loginBtn').disabled=true;status('loginStatus','Memeriksa akun…');try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);status('loginStatus','Login berhasil.')}catch(e){status('loginStatus',e.code==='auth/invalid-credential'?'Email atau kata sandi salah.':(e.message||'Login gagal.'))}finally{$('loginBtn').disabled=false}});
$('create').addEventListener('click',async()=>{const id=$('binaan').value,b=binaanCache.find(x=>x.id===id);if(!b){status('out','Pilih binaan terlebih dahulu.');return}const btn=$('create');btn.disabled=true;try{await verify(auth.currentUser);const token=randomToken();await setDoc(doc(db,'upas',UPA,'linkTokens',token),{binaanId:b.id,namaBinaan:b.nama,aktif:true,dibuatPada:serverTimestamp(),dibuatOleh:auth.currentUser.uid});currentLink=new URL('Mutabaah-Binaan.html',location.href).href+'?token='+token;$('out').textContent='Tautan berhasil dibuat untuk '+b.nama+'.\n\n'+currentLink+'\n\nSimpan dan bagikan hanya kepada binaan ini. Token ini memberi hak mengirim laporan untuk binaan tersebut.';$('copy').hidden=false}catch(e){console.error('Gagal membuat tautan:',e);status('out','GAGAL MEMBUAT TAUTAN\nKode: '+(e.code||'tidak diketahui')+'\nPesan: '+(e.message||'Tidak ada detail')+'\n\nKirimkan kode dan pesan error ini untuk diagnosis.')}finally{btn.disabled=false}});
$('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(currentLink);status('out',$('out').textContent+'\n\nTautan disalin.')}catch{status('out','Salin tautan secara manual dari teks di atas.')}});$('logout').addEventListener('click',()=>signOut(auth));
</script></main></body></html>
