<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f766e"><title>Laporan Mutabaah Binaan</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#0f172a;background:#f1f5f9}*{box-sizing:border-box}body{margin:0;padding:18px}.wrap{max-width:680px;margin:0 auto}.brand{padding:12px 4px 18px}.brand small{color:#0f766e;font-weight:800;letter-spacing:.08em}.brand h1{font-size:26px;margin:5px 0}.brand p{margin:0;color:#64748b}.card{background:white;border:1px solid #e2e8f0;border-radius:18px;padding:20px;box-shadow:0 8px 24px #0f172a0b}.notice{background:#ecfeff;border:1px solid #a5f3fc;padding:12px;border-radius:12px;font-size:14px;margin-bottom:16px}.field{margin:14px 0}.field label{display:block;font-weight:700;font-size:14px;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:12px;font:inherit;background:#fff}.field textarea{min-height:100px;resize:vertical}button{width:100%;border:0;border-radius:12px;padding:14px;background:#0f766e;color:white;font-weight:800;font:inherit;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.status{margin-top:14px;padding:12px;border-radius:10px;display:none;white-space:pre-wrap}.status.show{display:block}.status.ok{background:#dcfce7;color:#166534}.status.err{background:#fee2e2;color:#991b1b}.foot{text-align:center;color:#64748b;font-size:12px;margin:18px}
</style></head><body><main class="wrap"><header class="brand"><small>RAKERGRUPUPA</small><h1>Laporan Mutabaah Yaumiah</h1><p>Formulir khusus binaan</p></header><section class="card"><div id="loading" class="notice">Memeriksa tautan khusus…</div><div id="app" hidden><div class="notice">Nama binaan: <strong id="binaanName">—</strong><br>Isi laporan dengan benar, lalu tekan Kirim Laporan.</div><form id="form"><div class="field"><label for="tanggal">Tanggal laporan</label><input id="tanggal" type="date" required></div><div class="field"><label for="jenis">Kategori</label><select id="jenis" required><option value="">Pilih kategori</option><option>Ibadah</option><option>Al-Qur'an</option><option>Puasa</option><option>Ilmu dan bacaan</option><option>Olahraga</option><option>Silaturahim</option><option>Lainnya</option></select></div><div class="field"><label for="catatan">Catatan / pencapaian</label><textarea id="catatan" maxlength="2000" required placeholder="Tuliskan pencapaian hari ini, misalnya tilawah 2 juz, shalat dhuha, dan lainnya."></textarea></div><div class="field"><label for="status">Status laporan</label><select id="status" required><option value="terkirim">Terkirim</option><option value="perlu_ditinjau">Perlu ditinjau pembina</option></select></div><button id="send" type="submit">Kirim Laporan</button></form></div><div id="statusMsg" class="status" role="status" aria-live="polite"></div></section><div class="foot">Laporan akan dikirim ke penyimpanan Mutabaah UPA.</div></main>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js';
import { getFirestore, doc, getDoc, collection, addDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyC8tcfOZ4hl7mBImcfTtrU2OtKq9aWJC9s',authDomain:'mutabaah-upa-test.firebaseapp.com',projectId:'mutabaah-upa-test',storageBucket:'mutabaah-upa-test.firebasestorage.app',messagingSenderId:'154416733757',appId:'1:154416733757:web:dc4e727429df8a3d4f1454'};
const UPA_ID='UPA_TEST_001';
const app=initializeApp(firebaseConfig); const db=getFirestore(app);
const $=id=>document.getElementById(id); const token=new URLSearchParams(location.search).get('token')||'';
const msg=(text,kind='err')=>{const el=$('statusMsg');el.textContent=text;el.className='status show '+kind;};
let linkInfo=null;
async function init(){try{if(!/^[A-Za-z0-9_-]{32,100}$/.test(token))throw new Error('Tautan tidak valid atau tidak lengkap. Minta tautan baru kepada pembina.');const snap=await getDoc(doc(db,'upas',UPA_ID,'linkTokens',token));if(!snap.exists())throw new Error('Tautan tidak ditemukan. Minta pembina memeriksa tautan Anda.');linkInfo=snap.data();if(linkInfo.aktif!==true||!linkInfo.binaanId||!linkInfo.namaBinaan)throw new Error('Tautan ini sudah dinonaktifkan atau belum dikonfigurasi. Hubungi pembina.');$('binaanName').textContent=linkInfo.namaBinaan;$('tanggal').value=new Date().toLocaleDateString('en-CA');$('loading').hidden=true;$('app').hidden=false;}catch(e){$('loading').textContent=e.message||'Tautan tidak dapat diverifikasi.';}}
$('form').addEventListener('submit',async e=>{e.preventDefault();if(!linkInfo)return;const btn=$('send');btn.disabled=true;btn.textContent='Mengirim…';try{const tanggal=$('tanggal').value,jenis=$('jenis').value,catatan=$('catatan').value.trim(),status=$('status').value;if(!tanggal||!jenis||catatan.length<3)throw new Error('Lengkapi tanggal, kategori, dan catatan (minimal 3 karakter).');if(catatan.length>2000)throw new Error('Catatan terlalu panjang.');await addDoc(collection(db,'upas',UPA_ID,'mutabaah'),{binaanId:linkInfo.binaanId,tanggal,jenis,catatan,status,pencatatUid:'tautan:'+token.slice(0,8),tokenRef:token,dibuatPada:serverTimestamp(),sumber:'tautan_binaan'});msg('Laporan berhasil dikirim. Terima kasih.','ok');$('form').reset();$('tanggal').value=new Date().toLocaleDateString('en-CA');}catch(e){msg(e.code==='permission-denied'?'Pengiriman ditolak oleh aturan keamanan. Admin perlu memasang aturan yang sesuai.':(e.message||'Laporan gagal dikirim. Periksa koneksi internet.'));}finally{btn.disabled=false;btn.textContent='Kirim Laporan';}});
init();
</script></body></html>
