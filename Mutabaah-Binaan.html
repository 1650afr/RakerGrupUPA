<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mutabaah Yaumiah Binaan</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#0f172a;font:16px system-ui,sans-serif}.wrap{max-width:720px;margin:24px auto;padding:16px}.card{background:white;border:1px solid #e2e8f0;border-radius:16px;padding:22px;margin-bottom:16px;box-shadow:0 2px 8px #00000008}h1{font-size:24px;margin:0 0 6px}p{color:#64748b;line-height:1.5}.tag{display:inline-block;background:#ccfbf1;color:#0f766e;border-radius:20px;padding:5px 10px;font-size:12px;font-weight:700;margin-bottom:14px}label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}input,textarea,select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font:inherit;background:white}button{width:100%;padding:13px;border:0;border-radius:10px;background:#0d9488;color:white;font-weight:700;font-size:15px;margin-top:18px}button:disabled{opacity:.5}#status{white-space:pre-wrap;font-size:14px}.mut{display:grid;grid-template-columns:1fr 100px;gap:10px;align-items:center;border-bottom:1px solid #e2e8f0;padding:10px 0}.mut label{margin:0}.small{font-size:13px}@media(max-width:500px){.wrap{padding:10px;margin:10px auto}.card{padding:16px}.mut{grid-template-columns:1fr 86px}}</style></head><body><div class="wrap"><div class="card"><span class="tag">FORM MUTABAAH PRIBADI</span><h1>Mutabaah Yaumiah</h1><p id="intro">Memeriksa tautan…</p><div id="formArea" hidden><label for="tanggal">Tanggal mutabaah</label><input id="tanggal" type="date"><div id="agenda"></div><label for="catatan">Catatan (opsional)</label><textarea id="catatan" rows="3" placeholder="Kendala atau catatan hari ini"></textarea><button id="send">Kirim Mutabaah</button></div><p id="status" role="status"></p></div><p class="small">Kiriman disimpan ke Firebase. Jangan bagikan tautan pribadi ini kepada orang lain.</p></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script>
const cfg={apiKey:"AIzaSyC8tcfOZ4hl7mBImcfTtrU2OtKq9aWJC9s",authDomain:"mutabaah-upa-test.firebaseapp.com",projectId:"mutabaah-upa-test",storageBucket:"mutabaah-upa-test.firebasestorage.app",messagingSenderId:"154416733757",appId:"1:154416733757:web:dc4e727429df8a3d4f1454"};if(!firebase.apps.length)firebase.initializeApp(cfg);const db=firebase.firestore();const token=new URLSearchParams(location.search).get('token');const intro=document.getElementById('intro'),status=document.getElementById('status'),form=document.getElementById('formArea');document.getElementById('tanggal').value=new Date().toISOString().slice(0,10);let binaan=null;
const agendaDefault=[{nama:'Shalat wajib berjamaah',target:5},{nama:'Tilawah Al-Qur’an (halaman)',target:2},{nama:'Hafalan Al-Qur’an (ayat)',target:1},{nama:'Dzikir pagi dan petang',target:2},{nama:'Shalat sunnah rawatib (rakaat)',target:12},{nama:'Qiyamul lail (rakaat)',target:2},{nama:'Puasa sunnah (hari)',target:1},{nama:'Infaq/sedekah (kali)',target:1}];let agendaList=agendaDefault;
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function start(){if(!token){intro.textContent='Tautan tidak lengkap. Minta tautan pribadi yang benar kepada pembina.';return;}try{const snap=await db.collection('upas').doc('UPA_TEST_001').collection('linkTokens').doc(token).get();if(!snap.exists||snap.data().aktif!==true){intro.textContent='Tautan tidak ditemukan atau sudah dinonaktifkan. Hubungi pembina.';return;}binaan=snap.data();agendaList=Array.isArray(binaan.agenda)&&binaan.agenda.length?binaan.agenda:agendaDefault;intro.textContent='Nama: '+binaan.nama+(binaan.jenjang?' • '+binaan.jenjang:'')+'\nPembina: '+(binaan.pembina||'-');document.getElementById('agenda').innerHTML=agendaList.map((a,i)=>'<div class="mut"><label for="v'+i+'">'+safe(a.nama)+' <span class="small">(Target '+a.target+')</span></label><input id="v'+i+'" type="number" min="0" step="any" inputmode="decimal" placeholder="0"></div>').join('');form.hidden=false;}catch(e){intro.textContent='Tidak dapat memeriksa tautan. Periksa koneksi atau hubungi pembina.';status.textContent=e.message;}}
document.getElementById('send').onclick=async()=>{const btn=document.getElementById('send');if(!binaan)return;btn.disabled=true;status.textContent='Mengirim…';try{const tanggal=document.getElementById('tanggal').value;if(!tanggal)throw Error('Pilih tanggal terlebih dahulu.');const nilai={};agendaList.forEach((a,i)=>{const v=document.getElementById('v'+i).value;nilai[a.nama]=v===''?null:Number(v);});const catatan=document.getElementById('catatan').value.trim();await db.collection('upas').doc('UPA_TEST_001').collection('mutabaah').add({binaanId:binaan.binaanId,namaBinaan:binaan.nama,jenjang:binaan.jenjang||'',pembina:binaan.pembina||'',tanggal,jenis:'harian',nilai,catatan,ringkasan:agendaList.map(a=>a.nama+': '+(nilai[a.nama]??'-')+' / target '+a.target).join('; '),sumber:'tautan-publik',tokenRef:token,status:'terkirim',dibuatPada:firebase.firestore.FieldValue.serverTimestamp()});status.textContent='Alhamdulillah, Mutabaah berhasil dikirim.';form.hidden=true;}catch(e){status.textContent='Belum berhasil dikirim: '+(e.message||e)+'\nSilakan coba lagi atau hubungi pembina.';btn.disabled=false;}};start();
</script></body></html>
